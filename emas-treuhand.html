<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>emas Treuhand GmbH | Entwurf der neuen Startseite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --stage:#e7e5e0; --surface:#f5f4f1; --ink:#16191d; --muted:#5b5f64; --line:#d2cfc8;
  --red:#c8261b; --bezel:#16191d; --chrome:#efeeea; --shadow:rgba(22,25,29,.28);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --stage:#1a1d21; --surface:#24282d; --ink:#f0eee9; --muted:#a2a5a9; --line:#363b41;
    --bezel:#0b0c0e; --chrome:#2a2e34; --shadow:rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --stage:#1a1d21; --surface:#24282d; --ink:#f0eee9; --muted:#a2a5a9; --line:#363b41;
  --bezel:#0b0c0e; --chrome:#2a2e34; --shadow:rgba(0,0,0,.55);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--stage); color:var(--ink);
  font-family:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; line-height:1.45;
}
header{
  display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;
  padding:18px clamp(16px,4vw,48px); border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:14px; min-width:0}
.mark{width:38px; height:38px; flex:none; display:block}
.brand h1{font-size:18px; font-weight:700; letter-spacing:-.01em; line-height:1.2}
.brand p{font-size:14px; color:var(--muted)}
.controls{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:4px; padding:3px; background:var(--surface)}
.seg button{
  font:inherit; font-size:14px; font-weight:600; border:0; background:transparent; color:var(--muted);
  padding:8px 14px; border-radius:2px; cursor:pointer;
}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--stage)}
.full{
  font:inherit; font-size:14px; font-weight:600; border:1px solid var(--ink); background:transparent;
  color:var(--ink); padding:9px 16px; border-radius:4px; cursor:pointer;
}
.full:hover{background:var(--ink); color:var(--stage)}
button:focus-visible{outline:2px solid var(--red); outline-offset:2px}

main{padding:clamp(24px,4vw,56px) clamp(16px,4vw,48px) 32px}
.stage{display:flex; align-items:flex-end; justify-content:center; gap:40px; max-width:1560px; margin:0 auto}
.stage.stacked{flex-direction:column; align-items:center}
figure{flex:none; display:flex; flex-direction:column; align-items:center}
figcaption{font-size:13px; color:var(--muted); margin-top:14px}

.desktop{
  border-radius:8px; overflow:hidden; background:var(--chrome); border:1px solid var(--line);
  box-shadow:0 40px 70px -40px var(--shadow);
}
.bar{height:34px; display:flex; align-items:center; padding:0 14px; gap:12px; border-bottom:1px solid var(--line)}
.dots{display:flex; gap:6px; flex:none}
.dots i{width:10px; height:10px; border-radius:50%; background:var(--line)}
.addr{
  flex:1; max-width:360px; margin:0 auto; height:22px; border-radius:4px; background:var(--surface);
  font-size:12px; color:var(--muted); display:flex; align-items:center; justify-content:center;
  white-space:nowrap; overflow:hidden;
}
.phone{padding:12px; border-radius:50px; background:var(--bezel); box-shadow:0 40px 70px -40px var(--shadow)}
.phone .vp{border-radius:38px}
.vp{position:relative; overflow:hidden; background:#16191d}
.vp iframe{position:absolute; top:0; left:0; border:0; transform-origin:0 0; background:#fff}
.vp .wait{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  color:#9a9ea3; font-size:14px; pointer-events:none;
}
.vp.ready .wait{display:none}

.note{max-width:1560px; margin:36px auto 0; display:flex; justify-content:space-between; gap:12px 32px; flex-wrap:wrap;
  border-top:1px solid var(--line); padding-top:18px; font-size:14px; color:var(--muted)}
.note strong{color:var(--ink); font-weight:600}
.hidden{display:none !important}

#fs{position:fixed; inset:0; z-index:50; background:#fff}
#fs iframe{position:absolute; inset:0; width:100%; height:100%; border:0}
#fs .close{
  position:fixed; z-index:51; right:calc(16px + env(safe-area-inset-right,0px));
  top:calc(16px + env(safe-area-inset-top,0px));
  font:inherit; font-size:14px; font-weight:600; border:0; border-radius:4px; cursor:pointer;
  background:#16191d; color:#fff; padding:10px 16px; box-shadow:0 6px 20px rgba(0,0,0,.25);
}
@media (max-width:560px){
  .brand p{font-size:13px}
  .controls{width:100%}
  .seg{flex:1} .seg button{flex:1; padding:8px 6px}
}
</style>
</head>

<script>
(function(){
  var D = {w:1440, h:900}, M = {w:390, h:844}, BEZEL = 24, BAR = 35, GAP = 40;
  var html = null;
  function siteHtml(){
    if (html === null){
      var bin = atob(document.getElementById('site').textContent.trim());
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      html = new TextDecoder().decode(bytes);
      html = html.replace('<head>', '<head>' + document.getElementById('fix').textContent.replace('<\\/script>', '</' + 'script>'));
    }
    return html;
  }
  // Sicherheitsnetz: Verlässt die Vorschau je die Seite (z.B. blockierter Link),
  // wird sie sofort wieder geladen, damit niemand festhängt.
  var resets = 0;
  function guard(f){
    f.addEventListener('load', function(){
      if (!f.getAttribute('srcdoc')) return;
      var ok = false;
      try { ok = f.contentWindow.location.href === 'about:srcdoc'; } catch (e) {}
      if (!ok) f.srcdoc = siteHtml() + '<!-- ' + (++resets) + ' -->';
    });
  }
  function mount(vp){
    var f = vp.querySelector('iframe');
    if (f.dataset.mounted) return;
    f.dataset.mounted = '1';
    f.addEventListener('load', function(){ vp.classList.add('ready'); }, {once:true});
    guard(f);
    f.srcdoc = siteHtml();
  }

  var stage = document.getElementById('stage');
  var header = document.querySelector('header');
  var figD = document.getElementById('figDesktop'), figM = document.getElementById('figMobile');
  var vpD = document.getElementById('vpDesktop'), vpM = document.getElementById('vpMobile');
  var buttons = document.querySelectorAll('.seg button');
  var mode = window.matchMedia('(max-width: 760px)').matches ? 'mobile' : 'both';

  function sizeDesktop(w){
    var s = w / D.w;
    vpD.style.width = w + 'px'; vpD.style.height = Math.round(D.h * s) + 'px';
    vpD.querySelector('iframe').style.transform = 'scale(' + s + ')';
  }
  function sizePhone(s){
    vpM.style.width = Math.round(M.w * s) + 'px'; vpM.style.height = Math.round(M.h * s) + 'px';
    vpM.querySelector('iframe').style.transform = 'scale(' + s + ')';
  }
  function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

  function layout(){
    var avail = stage.clientWidth;
    var vh = window.innerHeight - header.offsetHeight - 150;
    var stacked = false;
    figD.classList.toggle('hidden', mode === 'mobile');
    figM.classList.toggle('hidden', mode === 'desktop');

    if (mode === 'desktop'){
      var w = Math.min(avail, D.w, Math.max((vh - BAR) * D.w / D.h, Math.min(avail, 760)));
      sizeDesktop(Math.floor(w));
    } else if (mode === 'mobile'){
      sizePhone(clamp((vh - BEZEL) / M.h, 0.55, 1));
    } else if (avail < 760){
      stacked = true;
      sizeDesktop(Math.floor(avail));
      sizePhone(clamp((vh - BEZEL) / M.h, 0.55, 1));
    } else {
      // Handy so skalieren, dass es gleich hoch wird wie das Desktop-Fenster
      var r = D.h / D.w;
      var p = (BAR - BEZEL + r * (avail - GAP - BEZEL)) / (M.h + r * M.w);
      p = clamp(p, 0.45, 1);
      var dw = Math.min(D.w, avail - GAP - (M.w * p + BEZEL));
      if (dw >= D.w) p = clamp((BAR + D.h - BEZEL) / M.h, 0.45, 1);
      sizeDesktop(Math.floor(dw));
      sizePhone(p);
    }
    stage.classList.toggle('stacked', stacked);
    if (mode !== 'mobile') mount(vpD);
    if (mode !== 'desktop') mount(vpM);
  }

  function setMode(m){
    mode = m;
    buttons.forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.mode === m)); });
    layout();
  }
  buttons.forEach(function(b){ b.addEventListener('click', function(){ setMode(b.dataset.mode); }); });
  var t; window.addEventListener('resize', function(){ clearTimeout(t); t = setTimeout(layout, 80); });

  var fs = document.getElementById('fs'), fsFrame = fs.querySelector('iframe');
  var openBtn = document.getElementById('openFull'), closeBtn = document.getElementById('closeFull');
  function openFull(){
    fs.classList.remove('hidden');
    document.documentElement.style.overflow = 'hidden';
    if (!fsFrame.dataset.guarded){ guard(fsFrame); fsFrame.dataset.guarded = '1'; }
    fsFrame.srcdoc = siteHtml();
    closeBtn.focus();
  }
  function closeFull(){
    fs.classList.add('hidden');
    document.documentElement.style.overflow = '';
    fsFrame.removeAttribute('srcdoc'); fsFrame.src = 'about:blank';
    openBtn.focus();
  }
  openBtn.addEventListener('click', openFull);
  closeBtn.addEventListener('click', closeFull);
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !fs.classList.contains('hidden')) closeFull(); });

  setMode(mode);
})();
</script>
