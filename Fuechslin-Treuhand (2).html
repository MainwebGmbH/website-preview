<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#E9E7E2;color:#1A1A1A;font-family:'Hanken Grotesk',system-ui,sans-serif}
body{display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 24px;padding:16px clamp(16px,2.5vw,36px);background:#E9E7E2;border-bottom:1px solid #D6D3CC}
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.logo{background:#fff;border-radius:8px;height:62px;min-width:62px;padding:8px 14px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.logo img{max-height:46px;max-width:170px;width:auto;display:block}
.name{font-size:clamp(18px,1.7vw,24px);font-weight:700;line-height:1.2}
.sub{margin-top:3px;font-size:clamp(14px,1.2vw,17px);color:#5E5B55}
.tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.seg{display:flex;background:#F4F3EF;border:1px solid #D6D3CC;border-radius:8px;padding:4px}
.seg button{height:42px;padding:0 18px;border:0;border-radius:6px;background:transparent;color:#3A3833;font:600 16px 'Hanken Grotesk',sans-serif;cursor:pointer}
.seg button.on{background:#1A1A1A;color:#fff}
.full{height:50px;display:flex;align-items:center;gap:9px;padding:0 20px;border:1.5px solid #1A1A1A;border-radius:8px;background:transparent;color:#1A1A1A;font:600 16px 'Hanken Grotesk',sans-serif;cursor:pointer;white-space:nowrap}
.full:hover{background:#1A1A1A;color:#fff}
main{flex:1;display:flex;justify-content:center;gap:44px;padding:36px}
.desk{display:flex;flex-direction:column;background:#fff;border:1px solid #D6D3CC;border-radius:12px;overflow:hidden;box-shadow:0 30px 60px -30px rgba(0,0,0,.25);min-width:0}
.bar{height:46px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 16px;background:#F4F3EF;border-bottom:1px solid #DEDBD4;position:relative}
.bar i{width:12px;height:12px;border-radius:50%;background:#D3D0C9}
.url{position:absolute;left:50%;transform:translateX(-50%);width:min(52%,620px);height:30px;border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;color:#5E5B55;white-space:nowrap;overflow:hidden}
.screen{position:relative;flex:1;min-height:0;overflow:hidden;background:#fff}
.screen iframe,.pscreen iframe{position:absolute;top:0;left:0;border:0;background:#fff}
.phone{position:relative;flex-shrink:0;padding:12px;background:#141414;box-shadow:0 30px 60px -25px rgba(0,0,0,.45)}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:34%;height:24px;border-radius:0 0 16px 16px;background:#141414;z-index:2}
.pscreen{position:relative;overflow:hidden;background:#fff}
.hidden{display:none!important}
.load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8A867E;font-size:15px}
.fs header{display:none}.fs main{padding:0!important}
</style>
</head>

<script id="page" type="text/plain"><!DOCTYPE html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>Füchslin Treuhand AG | Treuhand und Steuern in Einsiedeln</title><meta name="description" content="Füchslin Treuhand AG in Einsiedeln: Finanzbuchhaltung, Lohnbuchhaltung, Steuererklärungen, betriebswirtschaftliche Beratung und Treuhand. Seit 1991.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>:root{--p:#B60C31;--ph:#970A28;--p2:#FF8FA6;--onp:#fff;--dk:#2A1518;--ink:#22191A;--hink:#1E1415;--mut:#635A5B;--bg:#ffffff;--soft:#FBF4F4;--line:#EEE2E2;--fbg:#FDF9F9;--hbg:rgba(255,255,255,.92);--fh:'Manrope',system-ui,sans-serif;--fb:'Manrope',system-ui,sans-serif;--hw:700;--hls:-.03em;--qw:500;--emstyle:normal;--rb:10px;--rc:16px;--logoh:58px;--ovl1:rgba(10,14,22,.86);--ovl2:rgba(10,14,22,.45)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--fb);color:var(--ink);background:var(--bg);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3,h4{font-family:var(--fh);font-weight:var(--hw);letter-spacing:var(--hls);line-height:1.08;margin:0;color:var(--hink)}
h1 em,h2 em{font-style:var(--emstyle);color:var(--p)}
p{margin:0 0 1em}
.wrap{max-width:1220px;margin:0 auto;padding:0 32px}
.eyebrow{display:inline-flex;align-items:center;gap:12px;font:600 12.5px/1 var(--fb);letter-spacing:.16em;text-transform:uppercase;color:var(--p);margin-bottom:22px}
.eyebrow:before{content:"";width:28px;height:1.5px;background:currentColor}
.on-dark .eyebrow{color:var(--p2)}
section{padding:120px 0;position:relative}
.sec-head{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:end;margin-bottom:56px}
.sec-head h2{font-size:clamp(32px,3.6vw,50px)}
.sec-head p{color:var(--mut);margin:0;max-width:440px}
.btn{display:inline-flex;align-items:center;gap:10px;height:54px;padding:0 26px;border-radius:var(--rb);font:600 16px/1 var(--fb);text-decoration:none;cursor:pointer;border:1.5px solid transparent;transition:transform .2s ease,background .2s ease,box-shadow .2s ease,color .2s ease,border-color .2s;white-space:nowrap}
.btn svg{flex-shrink:0}
.btn-p{background:var(--p);color:var(--onp);box-shadow:0 10px 24px -12px var(--p)}
.btn-p:hover{transform:translateY(-2px);background:var(--ph);box-shadow:0 16px 30px -14px var(--p)}
.btn-o{border-color:currentColor;color:var(--ink)}
.btn-o:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.on-dark .btn-o{color:#fff}
.on-dark .btn-o:hover{background:#fff;color:var(--dk);border-color:#fff}
.btn-w{background:#fff;color:var(--dk)}
.btn-w:hover{transform:translateY(-2px)}
.link{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:15px;color:var(--p);text-decoration:none}
.link svg{transition:transform .2s}
.link:hover svg{transform:translateX(4px)}

/* header */
.hdr{position:sticky;top:0;z-index:50;background:var(--hbg);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid transparent;transition:box-shadow .3s,border-color .3s}
.hdr.sc{box-shadow:0 8px 30px -18px rgba(0,0,0,.35);border-color:var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:28px;height:84px}
.hdr .logo{min-width:0;flex-shrink:1}
.hdr .logo img{height:var(--logoh);width:auto;max-width:230px;object-fit:contain}
.nav{display:flex;gap:30px;margin-left:auto}
.nav a{text-decoration:none;font-size:15px;font-weight:500;color:var(--ink);position:relative;padding:6px 0}
.nav a:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--p);transform:scaleX(0);transform-origin:left;transition:transform .25s}
.nav a:hover:after{transform:scaleX(1)}
.hdr-tel{display:flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;font-size:15px;color:var(--ink);white-space:nowrap}
.hdr .btn{height:46px;padding:0 20px;font-size:15px}
.burger{display:none;width:46px;height:46px;border-radius:var(--rb);border:1.5px solid var(--line);background:transparent;cursor:pointer;align-items:center;justify-content:center;flex-direction:column;gap:5px;padding:0}
.burger i{display:block;width:20px;height:2px;background:var(--ink);transition:transform .25s,opacity .2s}
.menu-open .burger i:nth-child(1){transform:translateY(7px) rotate(45deg)}
.menu-open .burger i:nth-child(2){opacity:0}
.menu-open .burger i:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.drawer{display:none}

/* hero shared */
.hero{position:relative;overflow:hidden}
.hero h1{font-size:clamp(42px,5.4vw,78px);margin-bottom:26px;overflow-wrap:break-word;hyphens:manual}
.hero .lead{font-size:clamp(17px,1.35vw,19.5px);max-width:540px;color:var(--mut);margin-bottom:34px}
.hero .ctas{display:flex;gap:14px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-top:56px;padding-top:28px;border-top:1px solid var(--line)}
.stats b{display:block;font-family:var(--fh);font-weight:var(--hw);font-size:clamp(22px,2vw,30px);line-height:1.1;color:var(--hink);letter-spacing:var(--hls)}
.stats span{display:block;font-size:13.5px;color:var(--mut);margin-top:6px;line-height:1.4}
.on-dark{color:rgba(255,255,255,.86)}
.on-dark h1,.on-dark h2,.on-dark h3,.on-dark .stats b{color:#fff}
.on-dark .lead,.on-dark .stats span{color:rgba(255,255,255,.72)}
.on-dark .stats{border-color:rgba(255,255,255,.18)}

/* hero: photo */
.h-photo{min-height:min(92vh,880px);display:flex;align-items:flex-end;color:#fff}
.h-photo .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--hpos,center)}
.h-photo:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--ovl1) 0%,var(--ovl2) 52%,rgba(0,0,0,0) 100%),linear-gradient(0deg,rgba(0,0,0,.45),rgba(0,0,0,0) 45%)}
.h-photo .wrap{position:relative;z-index:2;width:100%;padding-top:120px;padding-bottom:64px}
.h-photo .inner{max-width:640px}

/* hero: portraits (split) */
.h-port{display:grid;grid-template-columns:1fr 1fr;min-height:min(90vh,860px);background:var(--dk)}
.h-port .pane{display:flex;flex-direction:column;justify-content:center;padding:96px max(48px,calc((100vw - 1220px)/2 + 32px));padding-right:64px}
.h-port .mosaic{display:grid;grid-template-columns:repeat(var(--mc,2),1fr);grid-auto-rows:1fr;gap:3px;background:var(--dk);height:min(90vh,860px)}
.h-port .mosaic figure{min-height:0}
.h-port .mosaic figure{margin:0;position:relative;overflow:hidden;background:#222}
.h-port .mosaic img{width:100%;height:100%;object-fit:cover;object-position:center 12%;transition:transform .8s cubic-bezier(.2,.7,.2,1),filter .5s}
.h-port .mosaic figure:hover img{transform:scale(1.05)}
.h-port .mosaic figcaption{position:absolute;left:12px;bottom:10px;right:12px;color:#fff;font-size:13px;font-weight:600;text-shadow:0 1px 8px rgba(0,0,0,.6);opacity:0;transform:translateY(6px);transition:.3s}
.h-port .mosaic figure:hover figcaption{opacity:1;transform:none}

/* hero: circle */
.h-circle{display:grid;grid-template-columns:1fr 1fr;min-height:min(88vh,820px);background:var(--soft)}
.h-circle .pane{display:flex;flex-direction:column;justify-content:center;padding:96px 64px 96px max(32px,calc((100vw - 1220px)/2 + 32px))}
.h-circle .visual{position:relative;overflow:hidden}
.h-circle .visual>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.85)}
.h-circle .visual:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,.25));z-index:1}
.h-circle .ring{position:absolute;z-index:2;left:50%;top:46%;transform:translate(-50%,-50%);width:min(30vw,440px);aspect-ratio:1;border-radius:50%;overflow:hidden;border:10px solid #fff;box-shadow:0 30px 70px -20px rgba(0,0,0,.45)}
.h-circle .ring img{width:100%;height:100%;object-fit:cover;object-position:var(--rpos,center 25%)}
.h-circle .tag{position:absolute;z-index:3;left:8%;bottom:9%;background:#fff;border-radius:var(--rc);padding:16px 20px;box-shadow:0 20px 40px -20px rgba(0,0,0,.4);max-width:330px}
.h-circle .tag b{display:block;font-family:var(--fh);font-size:18px;color:var(--hink)}
.h-circle .tag span{font-size:13.5px;color:var(--mut)}
.h-circle .accent{position:absolute;z-index:3;width:110px;height:110px;border-radius:50%;background:var(--p);right:18%;top:16%;opacity:.95;mix-blend-mode:multiply}

/* hero: soft */
.h-soft{min-height:min(88vh,820px);display:flex;align-items:center;padding:110px 0 150px}
.h-soft .bgimg{position:absolute;top:0;right:0;width:62%;height:100%;object-fit:cover;object-position:var(--hpos,center)}
.h-soft:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,var(--bg) 38%,color-mix(in srgb,var(--bg) 70%,transparent) 55%,color-mix(in srgb,var(--bg) 0%,transparent) 80%)}
.h-soft .wrap{position:relative;z-index:2;width:100%}
.h-soft .inner{max-width:620px}
.avatars{display:flex;align-items:center;gap:14px;margin-top:38px}
.avatars .st{display:flex}
.avatars .st img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:3px solid var(--bg);margin-left:-12px;background:#ddd}
.avatars .st img:first-child{margin-left:0}
.avatars b{display:block;font-size:14.5px;color:var(--hink)}
.avatars span{font-size:13px;color:var(--mut)}
.trustbar{position:relative;z-index:3;margin-top:-90px}
.trustbar .card{background:#fff;border-radius:var(--rc);box-shadow:0 30px 60px -30px rgba(0,0,0,.28);display:grid;grid-template-columns:repeat(var(--tn,4),1fr)}
.trustbar .it{padding:28px 30px;border-left:1px solid var(--line)}
.trustbar .it:first-child{border-left:0}
.trustbar b{display:block;font-family:var(--fh);font-weight:var(--hw);font-size:24px;color:var(--p);line-height:1.15}
.trustbar span{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-top:8px;font-weight:600}

/* hero: type */
.h-type{padding:96px 0 110px}
.h-type .grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:64px;align-items:center}
.h-type h1{font-size:clamp(48px,6.4vw,96px)}
.h-type .ph{position:relative}
.h-type .ph img{border-radius:var(--rc);width:100%;aspect-ratio:4/5;object-fit:cover;object-position:var(--hpos,center)}
.h-type .badge{position:absolute;left:-36px;bottom:40px;background:var(--dk);color:#fff;border-radius:var(--rc);padding:22px 24px;max-width:280px;box-shadow:0 30px 60px -30px rgba(0,0,0,.5)}
.h-type .badge b{display:block;font-family:var(--fh);font-size:20px;color:#fff;margin-bottom:4px}
.h-type .badge span{font-size:13.5px;color:rgba(255,255,255,.75)}

/* logos strip */
.strip{padding:30px 0;border-bottom:1px solid var(--line);background:var(--bg)}
.strip .wrap{display:flex;align-items:center;justify-content:center;gap:56px;flex-wrap:wrap;color:var(--mut);font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.strip img{height:34px;width:auto;opacity:.85;filter:grayscale(.2)}

/* services */
.svc{display:grid;grid-template-columns:repeat(var(--sc,3),1fr);gap:22px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--rc);overflow:hidden;display:flex;flex-direction:column;transition:transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s,border-color .3s}
.card:hover{transform:translateY(-6px);box-shadow:0 30px 50px -30px rgba(0,0,0,.28);border-color:color-mix(in srgb,var(--p) 40%,var(--line))}
.card .cimg{aspect-ratio:16/9;overflow:hidden}
.card .cimg img{width:100%;height:100%;object-fit:cover;transition:transform .8s}
.card:hover .cimg img{transform:scale(1.05)}
.card .cb{padding:30px 30px 28px;display:flex;flex-direction:column;flex:1}
.card .num{font-family:var(--fh);font-size:15px;color:var(--p);font-weight:700;margin-bottom:18px;letter-spacing:.06em}
.card .k{font:600 11.5px/1 var(--fb);letter-spacing:.16em;text-transform:uppercase;color:var(--p);margin-bottom:12px}
.card h3{font-size:23px;margin-bottom:12px}
.card p{color:var(--mut);font-size:15.5px}
.card ul{list-style:none;padding:0;margin:4px 0 22px;display:grid;gap:9px}
.card li{display:flex;gap:10px;font-size:15px;line-height:1.45}
.card li svg{color:var(--p);margin-top:3px;flex-shrink:0}
.card .link{margin-top:auto}

/* about */

ären, was Sie brauchen.</p></div><div class="step rv dark"><b>3</b><h3>Lösung umsetzen</h3><p>Sie erhalten eine Lösung, die zu Ihnen passt, und eine feste Ansprechperson.</p></div></div></div></section><section id="kontakt" class="contact on-dark"><div class="wrap"><div class="g">

<script>
(function(){
  var html=document.getElementById('page').textContent.replace(/<\uE000/g,'<');
  var df=document.getElementById('dframe'),pf=document.getElementById('pframe');
  df.srcdoc=html;pf.srcdoc=html;
  document.getElementById('full').onclick=function(){
    var w=null;
    try{var url=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));w=window.open(url,'_blank')}catch(e){}
    if(!w){try{w=window.open('','_blank');if(w){w.document.open();w.document.write(html);w.document.close()}}catch(e){}}
    if(!w){document.body.classList.add('fs')}
  };
  var mode='both';
  document.querySelectorAll('.seg button').forEach(function(btn){btn.onclick=function(){mode=btn.dataset.m;document.querySelectorAll('.seg button').forEach(function(x){x.classList.toggle('on',x===btn)});layout()}});
  var stage=document.getElementById('stage'),desk=document.getElementById('desk'),phone=document.getElementById('phone'),ds=document.getElementById('dscreen'),ps=document.getElementById('pscreen');
  function layout(){
    var vw=document.documentElement.clientWidth,vh=window.innerHeight,hh=document.querySelector('header').offsetHeight;
    var pad=vw<700?16:36;stage.style.padding=pad+'px';
    var availH=Math.max(560,vh-hh-pad*2);
    var row=vw>=1100&&mode==='both';
    stage.style.flexDirection=row?'row':'column';stage.style.alignItems=row?'flex-start':'center';
    desk.classList.toggle('hidden',mode==='phone');phone.classList.toggle('hidden',mode==='desktop');
    desk.style.flex=row?'1 1 auto':'0 0 auto';desk.style.width=row?'auto':'100%';
    desk.style.height=(row||mode==='desktop'?availH:Math.min(availH,Math.round(vw*0.62)))+'px';
    var s=Math.max(0.6,Math.min(mode==='phone'?1:0.92,(availH-24)/844,(vw-pad*2-24)/390));
    ps.style.width=Math.round(390*s)+'px';ps.style.height=Math.round(844*s)+'px';ps.style.borderRadius=Math.round(44*s)+'px';phone.style.borderRadius=Math.round(56*s)+'px';
    pf.style.width='390px';pf.style.height='844px';pf.style.zoom=s;
    var w=ds.clientWidth,h=ds.clientHeight,sc=(w||1000)/1440;df.style.width='1440px';df.style.height=Math.round((h||700)/sc)+'px';df.style.zoom=sc;
  }
  window.addEventListener('resize',layout);layout();setTimeout(layout,300);
  [df,pf].forEach(function(f){f.addEventListener('load',function(){var l=f.parentNode.querySelector('.load');if(l)l.remove()})});
})();
</script>
