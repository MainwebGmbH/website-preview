*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#E9E7E2;color:#1A1A1A;font-family:'Hanken Grotesk',system-ui,sans-serif}
body{display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 24px;padding:16px clamp(16px,2.5vw,36px);background:#E9E7E2;border-bottom:1px solid #D6D3CC}
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.logo{background:#fff;border-radius:8px;height:62px;min-width:62px;padding:8px 14px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.logo img{max-height:46px;max-width:170px;width:auto;display:block}
.name{font-size:clamp(18px,1.7vw,24px);font-weight:700;line-height:1.2}
.sub{margin-top:3px;font-size:clamp(14px,1.2vw,17px);color:#5E5B55}
.tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.seg{display:flex;background:#F4F3EF;border:1px solid #D6D3CC;border-radius:8px;padding:4px}
.seg button{height:42px;padding:0 18px;border:0;border-radius:6px;background:transparent;color:#3A3833;font:600 16px 'Hanken Grotesk',sans-serif;cursor:pointer}
.seg button.on{background:#1A1A1A;color:#fff}
.full{height:50px;display:flex;align-items:center;gap:9px;padding:0 20px;border:1.5px solid #1A1A1A;border-radius:8px;background:transparent;color:#1A1A1A;font:600 16px 'Hanken Grotesk',sans-serif;cursor:pointer;white-space:nowrap}
.full:hover{background:#1A1A1A;color:#fff}
main{flex:1;display:flex;justify-content:center;gap:44px;padding:36px}
.desk{display:flex;flex-direction:column;background:#fff;border:1px solid #D6D3CC;border-radius:12px;overflow:hidden;box-shadow:0 30px 60px -30px rgba(0,0,0,.25);min-width:0}
.bar{height:46px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 16px;background:#F4F3EF;border-bottom:1px solid #DEDBD4;position:relative}
.bar i{width:12px;height:12px;border-radius:50%;background:#D3D0C9}
.url{position:absolute;left:50%;transform:translateX(-50%);width:min(52%,620px);height:30px;border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;color:#5E5B55;white-space:nowrap;overflow:hidden}
.screen{position:relative;flex:1;min-height:0;overflow:hidden;background:#fff}
.screen iframe,.pscreen iframe{position:absolute;top:0;left:0;border:0;background:#fff}
.phone{position:relative;flex-shrink:0;padding:12px;background:#141414;box-shadow:0 30px 60px -25px rgba(0,0,0,.45)}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:34%;height:24px;border-radius:0 0 16px 16px;background:#141414;z-index:2}
.pscreen{position:relative;overflow:hidden;background:#fff}
.hidden{display:none!important}
.load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8A867E;font-size:15px}
</style>

<style>
:root{--navy:#17294E;--navy2:#0F1D39;--sky:#9FB4BE;--sky2:#DCE5EA;--gold:#C3A26B;--ink:#1E2533;--mut:#5D6673;--line:#E4E7EA;--bg:#fff;--soft:#F5F3EF;--cool:#F1F4F6;--fh:'Sora',system-ui,sans-serif;--fb:'Inter',system-ui,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--fb);color:var(--ink);background:var(--bg);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3,h4{font-family:var(--fh);margin:0;color:var(--navy);letter-spacing:-.03em;line-height:1.08;font-weight:600}
h2{font-size:clamp(32px,4vw,52px)}
h2 em,h1 em{font-style:normal;color:var(--gold)}
p{margin:0 0 1em}
.wrap{max-width:1220px;margin:0 auto;padding:0 32px}
section{padding:116px 0;position:relative}
.eyebrow{display:inline-flex;align-items:center;gap:12px;font:600 12.5px/1 var(--fb);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:22px}
.eyebrow:before{content:"";width:28px;height:1.5px;background:currentColor}
.lead{font-size:clamp(18px,1.45vw,20px);color:#3D4553;line-height:1.6}
.btn{display:inline-flex;align-items:center;gap:10px;height:56px;padding:0 28px;border-radius:6px;font:600 16px/1 var(--fb);text-decoration:none;cursor:pointer;border:1.5px solid transparent;transition:transform .2s,background .2s,box-shadow .2s,color .2s;white-space:nowrap}
.btn-n{background:var(--navy);color:#fff;box-shadow:0 14px 30px -16px var(--navy)}
.btn-n:hover{transform:translateY(-2px);background:var(--navy2)}
.btn-g{background:var(--gold);color:#fff}
.btn-g:hover{transform:translateY(-2px);background:#AE8D57}
.btn-o{border-color:var(--navy);color:var(--navy)}
.btn-o:hover{background:var(--navy);color:#fff}
.btn-ow{border-color:rgba(255,255,255,.55);color:#fff}
.btn-ow:hover{background:#fff;color:var(--navy)}
.rv{opacity:0;transform:translateY(24px);transition:opacity .8s ease,transform .8s ease}
.rv.in{opacity:1;transform:none}
.sec-head{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:end;margin-bottom:60px}
.sec-head p{margin:0;color:var(--mut)}

/* header */
.hdr{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;height:84px;gap:20px}
.logo{display:flex;align-items:center;gap:14px;text-decoration:none}
.logo img{height:56px;width:auto;border-radius:3px}
.logo span{font:600 12px/1.3 var(--fb);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.nav{display:flex;gap:28px}
.nav a{font-size:15px;font-weight:500;text-decoration:none;color:var(--ink)}
.nav a:hover{color:var(--gold)}
.hcta{display:flex;align-items:center;gap:16px}
.hcta .tel{font-weight:600;font-size:15px;text-decoration:none;color:var(--navy);display:flex;gap:8px;align-items:center}
.hcta .btn{height:46px;padding:0 20px;font-size:15px}
.burger{display:none;width:46px;height:46px;border-radius:6px;border:1px solid var(--line);background:#fff;align-items:center;justify-content:center;cursor:pointer}
.mnav{display:none}

/* hero */
.hero{padding:80px 0 0;background:linear-gradient(180deg,#fff 0%,var(--soft) 100%);overflow:hidden}
.hgrid{display:grid;grid-template-columns:1.08fr .92fr;gap:48px;align-items:center}
.hero h1{font-size:clamp(40px,4.3vw,60px);letter-spacing:-.045em;line-height:1.02}
.hero .lead{margin:26px 0 34px;max-width:540px}
.hbtns{display:flex;flex-wrap:wrap;gap:12px}
.hnote{display:flex;align-items:center;gap:14px;margin-top:34px;padding-top:26px;border-top:1px solid var(--line);max-width:540px}
.hnote .stars{display:flex;gap:3px;color:var(--gold)}
.hnote b{display:block;font-family:var(--fh);color:var(--navy);font-size:15px}
.hnote span{font-size:14px;color:var(--mut)}
.duo{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:16px;padding-bottom:60px}
.pc{position:relative;border-radius:14px;overflow:hidden;background:#5d6f95;box-shadow:0 40px 70px -40px rgba(23,41,78,.6)}
.pc img{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:76% 20%}
.pc:nth-child(2){margin-top:56px}
.pc .nm{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(255,255,255,.95);border-radius:10px;padding:12px 14px}
.pc .nm b{display:block;font-family:var(--fh);color:var(--navy);font-size:15.5px;line-height:1.25}
.pc .nm span{font-size:12.5px;color:var(--mut);line-height:1.35;display:block}
.bubble{position:absolute;z-index:3;left:-28px;bottom:20px;background:var(--navy);color:#fff;border-radius:14px;padding:16px 20px;display:flex;gap:12px;align-items:center;box-shadow:0 30px 50px -20px rgba(15,29,57,.6)}
.bubble .ic{width:40px;height:40px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center}
.bubble b{display:block;font-family:var(--fh);font-size:15px}
.bubble span{font-size:13px;opacity:.8}
.hfacts{background:var(--navy);color:#fff;position:relative;z-index:2}
.hfacts .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.hf{padding:34px 24px;border-left:1px solid rgba(255,255,255,.12)}
.hf:first-child{border-left:0;padding-left:0}
.hf b{display:block;font:600 clamp(28px,2.8vw,38px)/1 var(--fh);letter-spacing:-.03em;color:#fff}
.hf b em{font-style:normal;color:var(--gold)}
.hf span{display:block;margin-top:10px;font-size:14.5px;color:rgba(255,255,255,.72);line-height:1.45}

/* promise / about */
.about{display:grid;grid-template-columns:1fr 1fr;gap:72px;align-items:center}
.aimg{position:relative}
.aimg img{border-radius:14px;width:100%;aspect-ratio:5/4;object-fit:cover}
.aimg .q{position:absolute;right:-24px;bottom:-30px;max-width:330px;background:#fff;border-radius:14px;padding:22px 24px;box-shadow:0 30px 60px -30px rgba(23,41,78,.45);border-left:4px solid var(--gold)}
.aimg .q p{font-family:var(--fh);color:var(--navy);font-size:17px;line-height:1.4;font-weight:600;margin:0 0 8px}
.aimg .q span{font-size:13px;color:var(--mut)}
.vals{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:30px}
.val{padding:20px;border-radius:12px;background:var(--cool)}
.val b{display:flex;align-items:center;gap:10px;font-family:var(--fh);color:var(--navy);font-size:16.5px;margin-bottom:4px}
.val b i{width:30px;height:30px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--gold)}
.val span{font-size:14.5px;color:var(--mut)}

/* services */
.svc{background:var(--soft)}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.sv{background:#fff;border-radius:14px;padding:32px 30px 28px;border:1px solid var(--line);display:flex;flex-direction:column;transition:transform .3s,box-shadow .3s,border-color .3s}
.sv:hover{transform:translateY(-4px);box-shadow:0 30px 60px -36px rgba(23,41,78,.45);border-color:transparent}
.sv .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px}
.sv .ic{width:54px;height:54px;border-radius:12px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center}
.sv .no{font:600 14px var(--fh);color:var(--sky)}
.sv h3{font-size:23px;margin-bottom:8px}
.sv>p{font-size:15.5px;color:var(--mut)}
.sv ul{list-style:none;margin:6px 0 20px;padding:0;display:grid;gap:7px;font-size:14.5px}
.sv li{display:flex;gap:10px;align-items:flex-start}
.sv li:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);flex-shrink:0;margin-top:9px}
.sv a{margin-top:auto;font-weight:600;font-size:15px;color:var(--navy);text-decoration:none;display:flex;align-items:center;gap:8px}
.sv a:hover{color:var(--gold)}
.promo{margin-top:22px;display:grid;grid-template-columns:auto 1fr auto;gap:28px;align-items:center;padding:28px 34px;border-radius:14px;background:var(--navy);color:#fff}
.promo .pct{font:600 clamp(44px,5vw,64px)/1 var(--fh);color:var(--gold);letter-spacing:-.04em}
.promo b{display:block;font-family:var(--fh);font-size:20px;margin-bottom:4px}
.promo span{color:rgba(255,255,255,.75);font-size:15px}

/* trust band */
.trustband{padding:0}
.tb-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:560px}
.tb-img{position:relative;overflow:hidden}
.tb-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tb-img:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(23,41,78,0) 60%,rgba(23,41,78,.35))}
.tb-txt{background:var(--navy);color:#fff;padding:90px 70px;display:flex;flex-direction:column;justify-content:center}
.tb-txt h2{color:#fff}
.tb-txt .lead{color:rgba(255,255,255,.82);margin:22px 0 30px}
.tlist{display:grid;gap:14px}
.tlist>div{display:flex;gap:14px;align-items:flex-start}
.tlist i{width:28px;height:28px;border-radius:50%;background:rgba(195,162,107,.18);color:var(--gold);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tlist b{display:block;font-family:var(--fh);font-size:16.5px}
.tlist span{font-size:14.5px;color:rgba(255,255,255,.7)}

/* team */
.team{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.tm{display:grid;grid-template-columns:.95fr 1.05fr;background:#fff;border-radius:16px;overflow:hidden;border:1px solid var(--line);transition:box-shadow .3s,transform .3s}
.tm:hover{transform:translateY(-4px);box-shadow:0 40px 70px -40px rgba(23,41,78,.5)}
.tm .ph{background:#5d6f95;position:relative}
.tm .ph img{width:100%;height:100%;object-fit:cover;object-position:72% 15%;min-height:380px}
.tm .tb{padding:32px 30px;display:flex;flex-direction:column}
.tm .role{font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.tm h3{font-size:26px;margin-bottom:12px}
.tm .cred{font-size:15px;color:var(--mut);margin-bottom:18px}
.tm .lang{display:inline-flex;gap:6px;margin-bottom:20px}
.tm .lang span{font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--cool);color:var(--navy)}
.tm .ct{margin-top:auto;display:grid;gap:8px;padding-top:18px;border-top:1px solid var(--line)}
.tm .ct a{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:600;font-size:15px;color:var(--navy)}
.tm .ct a:hover{color:var(--gold)}
.teamnote{margin-top:24px;padding:28px 32px;border-radius:14px;background:var(--cool);display:flex;gap:22px;align-items:center}
.teamnote p{margin:0;color:#3D4553;font-size:16px}
.teamnote b{font-family:var(--fh);color:var(--navy)}

/* members */
.mem{background:var(--soft)}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.mb{background:#fff;border-radius:12px;padding:24px 22px;border:1px solid var(--line)}
.mb b{display:block;font-family:var(--fh);color:var(--navy);font-size:17px;margin-bottom:4px;letter-spacing:-.01em}
.mb span{font-size:14px;color:var(--mut);line-height:1.45;display:block}
.net{margin-top:24px;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:40px;border-radius:16px;background:#fff;border:1px solid var(--line)}
.net h3{font-size:28px;margin-bottom:12px}
.net p{color:var(--mut);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{font-size:14px;font-weight:600;padding:9px 14px;border-radius:999px;background:var(--cool);color:var(--navy)}

/* process */
.proc{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.st{padding:34px 30px;border-radius:14px;border:1px solid var(--line);position:relative}
.st .n{font:600 15px var(--fh);color:#fff;width:44px;height:44px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center;margin-bottom:22px}
.st h3{font-size:21px;margin-bottom:8px}
.st p{font-size:15.5px;color:var(--mut);margin:0}

/* faq */
.faqg{display:grid;grid-template-columns:.8fr 1.2fr;gap:60px}
.faq details{border-bottom:1px solid var(--line);padding:22px 0}
.faq summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:20px;font-family:var(--fh);font-weight:600;color:var(--navy);font-size:18.5px;letter-spacing:-.01em}
.faq summary::-webkit-details-marker{display:none}
.faq summary:after{content:"+";font-size:24px;line-height:1;color:var(--gold)}
.faq details[open] summary:after{content:"–"}
.faq details p{margin:12px 0 0;color:var(--mut);font-size:16px}

/* news */
.know{background:var(--cool)}
.kgrid{display:grid;grid-template-columns:1.25fr .75fr;gap:30px}
.nl{display:grid;gap:14px}
.nw{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;padding:24px;border-radius:14px;background:#fff;text-decoration:none;transition:transform .2s,box-shadow .2s}
.nw:hover{transform:translateY(-2px);box-shadow:0 20px 40px -26px rgba(23,41,78,.4)}
.nw .d{width:76px;height:76px;border-radius:12px;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--fh)}
.nw .d small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
.nw .d b{font-size:22px;line-height:1.1}
.nw h3{font-size:18px;margin-bottom:6px}
.nw ul{margin:0;padding:0;list-style:none;font-size:14.5px;color:var(--mut)}
.dl{background:#fff;border-radius:14px;padding:28px}
.dl h3{font-size:22px;margin-bottom:6px}
.dl>p{font-size:14.5px;color:var(--mut)}
.dl a{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line);text-decoration:none;font-weight:600;font-size:15px;color:var(--navy)}
.dl a:hover{color:var(--gold)}
.dl .fi{width:36px;height:36px;border-radius:8px;background:var(--cool);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--gold);flex-shrink:0}

/* cta band */
.band{padding:150px 0;color:#fff;overflow:hidden}
.band img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.band:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(15,29,57,.94),rgba(23,41,78,.7) 60%,rgba(23,41,78,.45))}
.band .wrap{position:relative;z-index:2}
.band h2{color:#fff;font-size:clamp(36px,4.8vw,62px);max-width:760px}
.band p{font-size:19px;color:rgba(255,255,255,.82);max-width:560px;margin:22px 0 34px}

/* contact */
.cgrid{display:grid;grid-template-columns:.95fr 1.05fr;gap:64px;align-items:start}
.cl{display:grid;gap:12px;margin-top:30px}
.ci{display:flex;gap:16px;align-items:center;padding:18px 20px;border-radius:12px;background:var(--cool);text-decoration:none}
.ci .ic{width:44px;height:44px;border-radius:10px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ci small{display:block;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.ci b{font-family:var(--fh);color:var(--navy);font-size:16.5px;font-weight:600}
.form{background:#fff;border-radius:16px;padding:40px;box-shadow:0 40px 90px -46px rgba(23,41,78,.45);border:1px solid var(--line)}
.form h3{font-size:26px;margin-bottom:6px}
.form>p{color:var(--mut);font-size:15px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fl{display:block;margin-bottom:14px}
.fl span{display:block;font-size:13px;font-weight:600;margin-bottom:7px;color:var(--navy)}
.fl input,.fl textarea,.fl select{width:100%;font:500 16px var(--fb);padding:14px 16px;border-radius:8px;border:1.5px solid var(--line);background:var(--cool);color:var(--ink)}
.fl input:focus,.fl textarea:focus,.fl select:focus{outline:0;border-color:var(--navy);background:#fff}
.fl textarea{min-height:120px;resize:vertical}
.form .btn{width:100%;justify-content:center}
.note{font-size:12.5px;color:var(--mut);margin:12px 0 0;text-align:center}

.ftr{background:var(--navy2);color:rgba(255,255,255,.72);padding:76px 0 36px;font-size:15px}
.fg{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:40px}
.ftr img{height:64px;width:auto;margin-bottom:18px;border-radius:3px}
.ftr h4{color:#fff;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:16px;font-family:var(--fb);font-weight:700}
.ftr a{color:rgba(255,255,255,.72);text-decoration:none}
.ftr a:hover{color:#fff}
.ftr ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.fb{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:56px;padding-top:24px;border-top:1px solid rgba(255,255,255,.1);font-size:13.5px}
.mbar{display:none}

@media (max-width:1080px){
  .nav,.hcta .tel,.logo span{display:none}
  .burger{display:flex}
  .mnav.open{display:flex;position:fixed;inset:84px 0 0;background:#fff;z-index:49;flex-direction:column;padding:24px 32px}
  .mnav a{font:600 22px var(--fh);color:var(--navy);text-decoration:none;padding:14px 0;border-bottom:1px solid var(--line)}
  .hgrid,.about,.cgrid,.kgrid,.faqg,.tb-grid,.net{grid-template-columns:minmax(0,1fr)}
  .sec-head{grid-template-columns:1fr;gap:18px}
  .duo{max-width:620px}
  .bubble{left:12px}
  .sgrid{grid-template-columns:1fr 1fr}
  .team{grid-template-columns:1fr}
  .mgrid{grid-template-columns:1fr 1fr}
  .tb-img{min-height:380px}
  .tb-txt{padding:70px 32px}
  .aimg .q{right:12px}
  .fg{grid-template-columns:1fr 1fr}
}
@media (max-width:700px){
  body{font-size:16px}
  .wrap{padding:0 20px}
  section{padding:80px 0}
  .hdr .wrap{height:72px}.logo img{height:46px}
  .mnav.open{inset:72px 0 0}
  .hcta .btn{display:none}
  .hero{padding-top:44px}
  .hbtns .btn{flex:1 1 100%;justify-content:center}
  .duo{gap:10px;padding-bottom:70px}
  .pc:nth-child(2){margin-top:36px}
  .pc .nm{left:8px;right:8px;bottom:8px;padding:9px 10px}
  .pc .nm b{font-size:13.5px}.pc .nm span{font-size:11px}
  .bubble{left:0;right:0;bottom:0;justify-content:center}
  .hfacts .wrap{grid-template-columns:1fr 1fr}
  .hf{padding:26px 14px}
  .hf:nth-child(odd){border-left:0;padding-left:0}
  .hf:nth-child(n+3){border-top:1px solid rgba(255,255,255,.12)}
  .vals,.sgrid,.proc,.fr,.mgrid{grid-template-columns:1fr}
  .aimg .q{position:relative;right:auto;bottom:auto;margin:-40px 14px 0;max-width:none}
  .promo{grid-template-columns:1fr;gap:12px;padding:26px 22px}
  .tm{grid-template-columns:1fr}
  .tm .ph img{min-height:0;aspect-ratio:4/3}
  .tm .tb{padding:26px 22px}
  .teamnote{flex-direction:column;align-items:flex-start;padding:24px}
  .net{padding:26px 22px}
  .nw{grid-template-columns:1fr}
  .form{padding:26px 20px}
  .fg{grid-template-columns:1fr}
  .band{padding:100px 0}
  .mbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:fixed;left:12px;right:12px;bottom:12px;z-index:60;transform:translateY(130%);transition:transform .35s}
  .mbar.show{transform:none}
  .mbar a{height:52px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;text-decoration:none;font-size:15px;box-shadow:0 16px 30px -12px rgba(15,29,57,.5)}
  .mbar a:first-child{background:#fff;color:var(--navy);border:1px solid var(--line)}
  .mbar a:last-child{background:var(--navy);color:#fff}
  .ftr{padding-bottom:100px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>

      <h1>Zahlen sind unser Handwerk. <em>Menschen</em> unsere Motivation.</h1>
      <p class="lead">Wenn es um Finanzen geht, ist Vertrauen gefragt. Seit 2009 begleiten wir Privatpersonen und KMU – von der einfachen Steuererklärung bis zur strategischen Unternehmenspositionierung. Persönlich, unabhängig und auf Augenhöhe.</p>

<section style="padding-top:0"><div class="wrap faqg">
  <div class="rv"><div class="eyebrow">Häufige Fragen</div><h2>Gut zu<br><em>wissen.</em></h2><p class="lead" style="margin-top:20px">Ihre Frage ist nicht dabei? Rufen Sie uns einfach an.</p><a class="btn btn-o" href="tel:+41415418090">041 541 80 90</a></div>
  <div class="faq rv">
    <details open><summary>Für wen ist Tamon Treuhand die richtige Wahl?</summary><p>Unser Angebot ist branchenunabhängig und richtet sich an Privatpersonen sowie Klein- und Mittelbetriebe – von der Steuererklärung bis zur strategischen Beratung.</p></details>
    <details><summary>Wie funktioniert die Steuererklärung mit Ihnen?</summary><p>Ganz bequem: Sie senden uns die ausgefüllte «Checkliste Steuererklärung» und Ihre Unterlagen – wir erledigen den Rest und berücksichtigen alle möglichen Abzüge.</p></details>
    <details><summary>Ich gründe gerade ein Unternehmen. Gibt es ein Angebot?</summary><p>Ja. KMU im ersten Geschäftsjahr erhalten 20 % Rabatt auf die komplette Buchführung. Gerne begleiten wir Sie auch bei Rechtsform und Gründung.</p></details>
    <details><summary>Können Sie unsere eigenen Mitarbeitenden einbinden?</summary><p>Sehr gerne. Wir sind flexibel und binden Ihre personellen Ressourcen ein, wenn es zu einer kostengünstigen Lösung führt.</p></details>
    <details><summary>Beraten Sie auch auf Englisch?</summary><p>Ja – beide Partner beraten Sie auf Deutsch und Englisch, auch bei internationalen Steuersituationen.</p></details>
  </div>
</div></section>

<script>
(function(){
  var html=document.getElementById('page').textContent.replace(/<\uE000/g,'<');
  var url=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));
  var df=document.getElementById('dframe'),pf=document.getElementById('pframe');
  df.src=url;pf.src=url;
  document.getElementById('full').onclick=function(){window.open(url,'_blank')};
  var mode='both';
  document.querySelectorAll('.seg button').forEach(function(btn){btn.onclick=function(){mode=btn.dataset.m;document.querySelectorAll('.seg button').forEach(function(x){x.classList.toggle('on',x===btn)});layout()}});
  var stage=document.getElementById('stage'),desk=document.getElementById('desk'),phone=document.getElementById('phone'),ds=document.getElementById('dscreen'),ps=document.getElementById('pscreen');
  function layout(){
    var vw=document.documentElement.clientWidth,vh=window.innerHeight,hh=document.querySelector('header').offsetHeight;
    var pad=vw<700?16:36;stage.style.padding=pad+'px';
    var availH=Math.max(560,vh-hh-pad*2);
    var row=vw>=1100&&mode==='both';
    stage.style.flexDirection=row?'row':'column';stage.style.alignItems=row?'flex-start':'center';
    desk.classList.toggle('hidden',mode==='phone');phone.classList.toggle('hidden',mode==='desktop');
    desk.style.flex=row?'1 1 auto':'0 0 auto';desk.style.width=row?'auto':'100%';
    desk.style.height=(row||mode==='desktop'?availH:Math.min(availH,Math.round(vw*0.62)))+'px';
    var s=Math.max(0.6,Math.min(mode==='phone'?1:0.92,(availH-24)/844,(vw-pad*2-24)/390));
    ps.style.width=Math.round(390*s)+'px';ps.style.height=Math.round(844*s)+'px';ps.style.borderRadius=Math.round(44*s)+'px';phone.style.borderRadius=Math.round(56*s)+'px';
    pf.style.width='390px';pf.style.height='844px';pf.style.zoom=s;
    var w=ds.clientWidth,h=ds.clientHeight,sc=(w||1000)/1440;df.style.width='1440px';df.style.height=Math.round((h||700)/sc)+'px';df.style.zoom=sc;
  }
  window.addEventListener('resize',layout);layout();setTimeout(layout,300);
  [df,pf].forEach(function(f){f.addEventListener('load',function(){var l=f.parentNode.querySelector('.load');if(l)l.remove()})});
})();
</script>
