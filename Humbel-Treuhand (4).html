*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#E9E7E2;color:#1A1A1A;font-family:'Hanken Grotesk',system-ui,sans-serif}
body{display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 24px;padding:16px clamp(16px,2.5vw,36px);background:#E9E7E2;border-bottom:1px solid #D6D3CC}
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.logo{background:#fff;border-radius:8px;height:62px;min-width:62px;padding:8px 14px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.logo img{max-height:46px;max-width:170px;width:auto;display:block}
.name{font-size:clamp(18px,1.7vw,24px);font-weight:700;line-height:1.2}
.sub{margin-top:3px;font-size:clamp(14px,1.2vw,17px);color:#5E5B55}
.tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.seg{display:flex;background:#F4F3EF;border:1px solid #D6D3CC;border-radius:8px;padding:4px}
.seg button{height:42px;padding:0 18px;border:0;border-radius:6px;background:transparent;color:#3A3833;font:600 16px 'Hanken Grotesk',sans-serif;cursor:pointer}
.seg button.on{background:#1A1A1A;color:#fff}
.full{height:50px;display:flex;align-items:center;gap:9px;padding:0 20px;border:1.5px solid #1A1A1A;border-radius:8px;background:transparent;color:#1A1A1A;font:600 16px 'Hanken Grotesk',sans-serif;cursor:pointer;white-space:nowrap}
.full:hover{background:#1A1A1A;color:#fff}
main{flex:1;display:flex;justify-content:center;gap:44px;padding:36px}
.desk{display:flex;flex-direction:column;background:#fff;border:1px solid #D6D3CC;border-radius:12px;overflow:hidden;box-shadow:0 30px 60px -30px rgba(0,0,0,.25);min-width:0}
.bar{height:46px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 16px;background:#F4F3EF;border-bottom:1px solid #DEDBD4;position:relative}
.bar i{width:12px;height:12px;border-radius:50%;background:#D3D0C9}
.url{position:absolute;left:50%;transform:translateX(-50%);width:min(52%,620px);height:30px;border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;color:#5E5B55;white-space:nowrap;overflow:hidden}
.screen{position:relative;flex:1;min-height:0;overflow:hidden;background:#fff}
.screen iframe,.pscreen iframe{position:absolute;top:0;left:0;border:0;background:#fff}
.phone{position:relative;flex-shrink:0;padding:12px;background:#141414;box-shadow:0 30px 60px -25px rgba(0,0,0,.45)}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:34%;height:24px;border-radius:0 0 16px 16px;background:#141414;z-index:2}
.pscreen{position:relative;overflow:hidden;background:#fff}
.hidden{display:none!important}
.load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8A867E;font-size:15px}
.fs header{display:none}.fs main{padding:0!important}
</style>

<style>
:root{--navy:#134F89;--navy2:#0E2B47;--deep:#0B1F33;--tan:#A9825A;--tan2:#C9A97F;--ink:#1E2329;--mut:#5C636B;--line:#E5E1DA;--ivory:#F8F5F0;--paper:#FCFBF8;--fh:'Source Serif 4',Georgia,serif;--fb:'Source Sans 3',system-ui,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--fb);color:var(--ink);background:#fff;font-size:18px;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3{font-family:var(--fh);font-weight:600;margin:0;line-height:1.08;color:var(--deep);letter-spacing:-.015em}
h2{font-size:clamp(36px,4.4vw,58px)}
h1 em,h2 em{font-style:italic;font-weight:400;color:var(--navy)}
p{margin:0 0 1em}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px}
section{padding:124px 0;position:relative}
.eyebrow{display:inline-flex;align-items:center;gap:14px;font:700 12px/1 var(--fb);letter-spacing:.22em;text-transform:uppercase;color:var(--tan);margin-bottom:24px}
.eyebrow:before{content:"";width:36px;height:1px;background:currentColor}
.lead{font-size:clamp(19px,1.5vw,21px);color:#3B4148;line-height:1.65}
.btn{display:inline-flex;align-items:center;gap:10px;height:58px;padding:0 30px;border-radius:2px;font:600 16px/1 var(--fb);letter-spacing:.01em;text-decoration:none;cursor:pointer;border:1px solid transparent;transition:background .25s,color .25s,transform .25s,box-shadow .25s;white-space:nowrap}
.btn-n{background:var(--navy);color:#fff;box-shadow:0 18px 36px -20px var(--navy)}
.btn-n:hover{background:var(--navy2);transform:translateY(-2px)}
.btn-o{border-color:var(--deep);color:var(--deep)}
.btn-o:hover{background:var(--deep);color:#fff}
.btn-t{background:var(--tan);color:#fff}
.btn-t:hover{background:#94704B}
.btn-ow{border-color:rgba(255,255,255,.55);color:#fff}
.btn-ow:hover{background:#fff;color:var(--deep)}
.rv{opacity:0;transform:translateY(24px);transition:opacity 1s,transform 1s}
.rv.in{opacity:1;transform:none}
.sec-head{display:grid;grid-template-columns:1.1fr .9fr;gap:60px;align-items:end;margin-bottom:64px}
.sec-head p{margin:0;color:var(--mut)}

.top{background:var(--deep);color:rgba(255,255,255,.75);font-size:14px}
.top .wrap{display:flex;justify-content:space-between;gap:20px;height:40px;align-items:center}
.top a{text-decoration:none;color:#fff}
.hdr{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;height:88px;gap:20px}
.logo img{height:54px;width:auto}
.nav{display:flex;gap:32px}
.nav a{font:600 15.5px var(--fb);text-decoration:none;color:var(--ink)}
.nav a:hover{color:var(--navy)}
.hcta .btn{height:48px;padding:0 22px;font-size:15px}
.burger{display:none;width:48px;height:48px;border:1px solid var(--line);background:#fff;align-items:center;justify-content:center;cursor:pointer}
.mnav{display:none}

/* hero */
.hero{padding:0;background:var(--ivory);overflow:hidden}
.hgrid{display:grid;grid-template-columns:1.05fr .95fr;min-height:min(86vh,780px)}
.htxt{padding:96px 64px 96px 0;display:flex;flex-direction:column;justify-content:center}
.hero h1{font-size:clamp(50px,6.2vw,92px);line-height:1.0;letter-spacing:-.025em}
.hero h1 em{display:block}
.hero .lead{max-width:540px;margin:30px 0 38px}
.hbtns{display:flex;flex-wrap:wrap;gap:12px}
.sig{display:flex;align-items:center;gap:18px;margin-top:48px;padding-top:28px;border-top:1px solid var(--line);max-width:540px}
.sig b{display:block;font:italic 600 24px var(--fh);color:var(--deep)}
.sig span{font-size:15px;color:var(--mut)}
.himg{position:relative;margin-right:calc(-1 * (max(0px, (100vw - 1240px) / 2) + 32px))}
.himg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:40% 20%}
.himg .since{position:absolute;left:-60px;bottom:70px;background:#fff;padding:26px 30px;box-shadow:0 40px 70px -40px rgba(11,31,51,.55);border-left:3px solid var(--tan)}
.himg .since b{display:block;font:600 56px/1 var(--fh);color:var(--navy)}
.himg .since span{display:block;margin-top:8px;font:700 12px var(--fb);letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}

/* milestones */
.ms{background:var(--deep);color:#fff;padding:0}
.ms .wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.m{padding:46px 30px 44px;border-left:1px solid rgba(255,255,255,.1);position:relative}
.m:first-child{border-left:0;padding-left:0}
.m b{display:block;font:600 44px/1 var(--fh);color:#fff}
.m b i{font-style:normal;color:var(--tan2)}
.m span{display:block;margin-top:12px;font-size:15.5px;color:rgba(255,255,255,.7);line-height:1.45}

/* intro */
.intro{display:grid;grid-template-columns:.9fr 1.1fr;gap:90px;align-items:start}
.intro .big{font:400 italic clamp(28px,2.6vw,38px)/1.35 var(--fh);color:var(--deep);margin:0}
.intro .big em{color:var(--navy)}
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:44px;border-top:1px solid var(--line)}
.pl{padding:28px 24px 0 0}
.pl .n{font:600 italic 20px var(--fh);color:var(--tan);margin-bottom:10px}
.pl h3{font-size:22px;margin-bottom:6px}
.pl p{font-size:16px;color:var(--mut);margin:0}

/* services */
.svc{background:var(--paper);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.groups{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.grp{background:#fff;border:1px solid var(--line);padding:46px 44px}
.grp .k{font:700 12px var(--fb);letter-spacing:.2em;text-transform:uppercase;color:var(--tan)}
.grp h3{font-size:36px;margin:10px 0 8px}
.grp>p{color:var(--mut);margin-bottom:26px}
.srv{border-top:1px solid var(--line)}
.srv details{border-bottom:1px solid var(--line)}
.srv summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:18px 0;font:600 20px var(--fh);color:var(--deep)}
.srv summary::-webkit-details-marker{display:none}
.srv summary:after{content:"+";font:400 26px/1 var(--fb);color:var(--tan);transition:transform .3s}
.srv details[open] summary:after{transform:rotate(45deg)}
.srv details p{margin:0 0 18px;color:var(--mut);font-size:16.5px;max-width:520px}

/* feature: buchhalter auf abruf */
.feat{display:grid;grid-template-columns:1.05fr .95fr;gap:80px;align-items:center}
.fcard{background:var(--deep);color:#fff;padding:54px 50px;position:relative}
.fcard:before{content:"";position:absolute;left:24px;top:24px;right:-24px;bottom:-24px;border:1px solid var(--tan2);z-index:-1}
.fcard h3{color:#fff;font-size:30px;margin-bottom:24px}
.frow{display:grid;grid-template-columns:auto 1fr;gap:20px;padding:18px 0;border-top:1px solid rgba(255,255,255,.12)}
.frow b{font:600 34px/1 var(--fh);color:var(--tan2);min-width:96px}
.frow span{color:rgba(255,255,255,.8);font-size:16.5px}
.flist{list-style:none;padding:0;margin:26px 0 32px;display:grid;gap:12px}
.flist li{display:flex;gap:14px}
.flist li:before{content:"";width:18px;height:1px;background:var(--navy);margin-top:14px;flex-shrink:0}

/* band portrait */
.band{padding:0;background:var(--deep);color:#fff}
.bgrid{display:grid;grid-template-columns:1fr 1fr;min-height:620px}
.bimg{position:relative}
.bimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:52% 30%}
.btxt{padding:100px 72px;display:flex;flex-direction:column;justify-content:center}
.btxt h2{color:#fff}
.btxt h2 em{color:var(--tan2)}
.btxt .lead{color:rgba(255,255,255,.8);margin:24px 0 30px}
.creds{display:grid;gap:14px}
.creds div{display:flex;gap:16px;align-items:baseline;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.12)}
.creds b{font:600 italic 20px var(--fh);color:var(--tan2);min-width:110px}
.creds span{color:rgba(255,255,255,.82);font-size:16.5px}

/* nachfolge */
.nf{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center}
.nfbox{background:var(--ivory);padding:50px;border-left:3px solid var(--tan)}
.nfbox p.q{font:400 italic 28px/1.4 var(--fh);color:var(--deep);margin:0 0 20px}
.nfbox ul{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.nfbox li{display:flex;gap:12px}
.nfbox li:before{content:"✓";color:var(--navy);font-weight:700}

/* faq */
.faq{background:var(--paper);border-top:1px solid var(--line)}
.fgrid{display:grid;grid-template-columns:.8fr 1.2fr;gap:80px}
.faq details{border-bottom:1px solid var(--line);padding:24px 0}
.faq summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:20px;font:600 21px var(--fh);color:var(--deep)}
.faq summary::-webkit-details-marker{display:none}
.faq summary:after{content:"+";font:400 26px/1 var(--fb);color:var(--tan);transition:transform .3s}
.faq details[open] summary:after{transform:rotate(45deg)}
.faq details p{margin:12px 0 0;color:var(--mut)}

/* contact */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:start}
.cl{margin-top:30px;border-top:1px solid var(--line)}
.ci{display:grid;grid-template-columns:130px 1fr;gap:20px;padding:18px 0;border-bottom:1px solid var(--line);text-decoration:none}
.ci small{font:700 11.5px var(--fb);letter-spacing:.18em;text-transform:uppercase;color:var(--tan);padding-top:4px}
.ci b{font:600 19px var(--fh);color:var(--deep)}
.mcard{display:flex;gap:18px;align-items:center;margin-top:30px;padding:22px;background:var(--ivory)}
.mcard img{width:84px;height:84px;object-fit:cover;border-radius:50%}
.mcard b{display:block;font:600 20px var(--fh);color:var(--deep)}
.mcard span{font-size:15px;color:var(--mut)}
.form{background:#fff;padding:46px;border:1px solid var(--line);box-shadow:0 40px 90px -60px rgba(11,31,51,.5)}
.form h3{font-size:34px;margin-bottom:6px}
.form>p{color:var(--mut);font-size:16px}
.frr{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fl{display:block;margin-bottom:16px}
.fl span{display:block;font:700 12px var(--fb);letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px;color:var(--deep)}
.fl input,.fl textarea,.fl select{width:100%;font:400 17px var(--fb);padding:14px 16px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:2px}
.fl input:focus,.fl textarea:focus,.fl select:focus{outline:0;border-color:var(--navy);background:#fff}
.fl textarea{min-height:120px;resize:vertical}
.form .btn{width:100%;justify-content:center}
.note{font-size:13px;color:var(--mut);margin:12px 0 0;text-align:center}

.ftr{background:var(--deep);color:rgba(255,255,255,.7);padding:80px 0 36px;font-size:15.5px}
.fg{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:40px}
.ftr .flogo{background:#fff;display:inline-block;padding:12px 16px;margin-bottom:18px}
.ftr .flogo img{height:44px;width:auto}
.ftr h4{color:#fff;font:700 12px var(--fb);letter-spacing:.2em;text-transform:uppercase;margin:0 0 16px}
.ftr a{color:rgba(255,255,255,.7);text-decoration:none}
.ftr a:hover{color:#fff}
.ftr ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.fb{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:56px;padding-top:24px;border-top:1px solid rgba(255,255,255,.1);font-size:14px}
.mbar{display:none}

@media (max-width:1080px){
  .top{display:none}
  .nav{display:none}
  .burger{display:flex}
  .hcta{display:flex;gap:10px;align-items:center}
  .mnav.open{display:flex;position:fixed;inset:88px 0 0;background:#fff;z-index:49;flex-direction:column;padding:24px 32px}
  .mnav a{font:600 26px var(--fh);text-decoration:none;padding:14px 0;border-bottom:1px solid var(--line)}
  .hgrid{grid-template-columns:1fr;min-height:0}
  .htxt{padding:64px 0 56px}
  .himg{margin:0 -32px;height:560px}
  .himg .since{left:32px;bottom:-40px}
  .ms{margin-top:0}
  .ms .wrap{grid-template-columns:repeat(2,minmax(0,1fr))}
  .m:nth-child(3){border-left:0;padding-left:0}
  .m:nth-child(n+3){border-top:1px solid rgba(255,255,255,.1)}
  .intro,.feat,.nf,.fgrid,.cgrid,.bgrid{grid-template-columns:minmax(0,1fr)}
  .sec-head{grid-template-columns:1fr;gap:18px}
  .groups{grid-template-columns:1fr}
  .bimg{min-height:480px}
  .btxt{padding:80px 32px}
  .fg{grid-template-columns:1fr 1fr}
  .fcard{margin-right:24px}
}
@media (max-width:700px){
  body{font-size:17px}
  .wrap{padding:0 20px}
  section{padding:88px 0}
  .hdr .wrap{height:74px}.logo img{height:44px}
  .mnav.open{inset:74px 0 0}
  .hcta .btn{display:none}
  .hbtns .btn{flex:1 1 100%;justify-content:center}
  .himg{margin:0 -20px;height:440px}
  .himg .since{display:none}
  .ms{padding-top:40px}
  .m{padding:30px 14px}
  .m b{font-size:34px}
  .m span{font-size:14px}
  .pillars{grid-template-columns:1fr}
  .grp{padding:32px 22px}
  .grp h3{font-size:30px}
  .fcard{padding:36px 26px;margin-right:16px}
  .fcard:before{left:16px;top:16px;right:-16px;bottom:-16px}
  .frow b{font-size:28px;min-width:80px}
  .bimg{min-height:380px}
  .btxt{padding:64px 20px}
  .creds b{min-width:90px;font-size:18px}
  .nfbox{padding:30px 24px}
  .nfbox p.q{font-size:23px}
  .ci{grid-template-columns:1fr;gap:4px}
  .frr{grid-template-columns:1fr}
  .form{padding:30px 20px}
  .fg{grid-template-columns:1fr}
  .mbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:fixed;left:12px;right:12px;bottom:12px;z-index:60;transform:translateY(130%);transition:transform .35s}
  .mbar.show{transform:none}
  .mbar a{height:54px;display:flex;align-items:center;justify-content:center;font:700 16px var(--fb);text-decoration:none;box-shadow:0 16px 30px -12px rgba(0,0,0,.45)}
  .mbar a:first-child{background:#fff;color:var(--deep);border:1px solid var(--line)}
  .mbar a:last-child{background:var(--navy);color:#fff}
  .ftr{padding-bottom:100px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.rv{opacity:1;transform:none}}
</style>

<section><div class="wrap intro">
  <div class="rv"><div class="eyebrow">Herzlich willkommen</div><h2>Goldrichtig <em>für alle Belange.</em></h2></div>
  <div class="rv">
    <p class="big">Sie erwarten ein breites Angebot an Finanzdienstleistungen für Privatpersonen und Firmen? Dann sind Sie bei uns <em>goldrichtig.</em></p>
    <p style="color:var(--mut);margin-top:26px">Wir sind ein kleineres Treuhandunternehmen in der Region, in dem motivierte und kompetente Mitarbeitende Aufträge für Klein- und Mittelbetriebe fachmännisch und speditiv abwickeln – und Mandate gegen ein angemessenes Honorar ganzheitlich betreuen.</p>
    <div class="pillars">
      <div class="pl"><div class="n">i.</div><h3>Fachmännisch</h3><p>Akademisch fundiert, praxiserprobt seit 1989.</p></div>
      <div class="pl"><div class="n">ii.</div><h3>Speditiv</h3><p>Kurze Wege, rasche Antworten, klare Termine.</p></div>

<section class="svc" id="leistungen"><div class="wrap">
  <div class="sec-head rv"><div><div class="eyebrow">Leistungen</div><h2>Für Privatpersonen <em>und Firmen.</em></h2></div><p class="lead">Wählen Sie Ihren Bereich – ein Klick auf eine Leistung zeigt Ihnen, wobei wir Sie konkret unterstützen.</p></div>
  <div class="groups">
    <div class="grp rv"><div class="k">Privatpersonen</div><h3>Ihre privaten Finanzen</h3><p>Damit Sie Ihre Steuern, Ihr Vermögen und Ihre Nachfolge in guten Händen wissen.</p>
      <div class="srv">
        <details open><summary>Steuerberatung</summary><p>Steuererklärungen, Steueroptimierung und kompetente Antworten auf Ihre Steuerfragen.</p></details>
        <details><summary>Buchhaltung</summary><p>Ordnung in Ihren privaten Finanzen und Liegenschaften – sauber dokumentiert.</p></details>
        <details><summary>Willensvollstreckung</summary><p>Planung von Erbschaften und Schenkungen, Testamente und Verträge zu Erbvorbezügen – rechtlich einwandfrei und steuerlich optimal.</p></details>
        <details><summary>Administrative Arbeiten</summary><p>Wir entlasten Sie bei Korrespondenz, Zahlungen und Unterlagen.</p></details>
      </div></div>
    <div class="grp rv"><div class="k">Firmenkunden</div><h3>Ihr Unternehmen</h3><p>Von der laufenden Buchhaltung bis zur gesetzlichen Revision – alles aus einer Hand.</p>
      <div class="srv">
        <details open><summary>Buchhaltung &amp; MWST</summary><p>Laufende Buchführung, Monats- und Quartalsabschlüsse, Jahresrechnung und Mehrwertsteuer.</p></details>
        <details><summary>Lohnbuchhaltung</summary><p>Korrekte Löhne, Sozialversicherungen und Lohnausweise – zuverlässig und termingerecht.</p></details>
        <details><summary>Steuerberatung</summary><p>Steuerplanung und Steuererklärungen für juristische Personen.</p></details>
        <details><summary>Finanzberatung</summary><p>Finanzpläne, Optimierung von Finanzierungen und Investitionen, Beratung beim Portfoliomanagement – bei Gründung, Expansion oder Restrukturierung.</p></details>
        <details><summary>Revision</summary><p>Abschlussprüfungen als gesetzliche Revisionsstelle (eingeschränkte Revision) und Beratung bei Rechnungsabschlüssen und Konsolidierungen.</p></details>
      </div></div>
  </div>
</div></section>

<section id="abruf"><div class="wrap feat">

    <h2>Buchhalter <em>auf Abruf.</em></h2>
    <p class="lead" style="margin-top:22px">Ausfälle, Engpässe oder Arbeitsspitzen verzögern die Buchhaltung? Wir stellen Ihnen erfahrene Fachkräfte direkt in Ihrem Unternehmen zur Verfügung – als Chefbuchhalter, Lohnbuchhalter oder Buchhaltungsassistenz.</p>

    <details open><summary>Für wen arbeiten Sie?</summary><p>Für Privatpersonen sowie Klein- und Mittelbetriebe. Für beide bieten wir Steuerberatung und Buchhaltung, für Firmen zusätzlich Lohnbuchhaltung, MWST, Finanzberatung und Revision.</p></details>
    <details><summary>Was heisst «Buchhalter auf Abruf»?</summary><p>Wir stellen Ihnen bei Ausfällen oder Arbeitsspitzen erfahrene Fachkräfte zur Verfügung – zwischen einem halben und vier Tagen pro Woche, für wenige Wochen oder mehrere Monate.</p></details>
    <details><summary>Übernehmen Sie Willensvollstreckungen?</summary><p>Ja. Wir unterstützen Sie bei Testamenten, Erbvorbezügen und Schenkungen und übernehmen Willensvollstreckungsmandate.</p></details>

<script>
(function(){
  var html=document.getElementById('page').textContent.replace(/<\uE000/g,'<');
  var df=document.getElementById('dframe'),pf=document.getElementById('pframe');
  var _fx='<script>document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a[href^=\'#\']");if(!a)return;var id=a.getAttribute("href").slice(1);e.preventDefault();if(!id){window.scrollTo({top:0,behavior:"smooth"});return}var t=document.getElementById(id);if(t)t.scrollIntoView({behavior:"smooth",block:"start"})},true);<\/script>';var _bi=html.lastIndexOf('</body>');var fhtml=_bi>-1?html.slice(0,_bi)+_fx+html.slice(_bi):html+_fx;
  df.srcdoc=fhtml;pf.srcdoc=fhtml;

    var w=null;
    try{var url=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));w=window.open(url,'_blank')}catch(e){}
    if(!w){try{w=window.open('','_blank');if(w){w.document.open();w.document.write(html);w.document.close()}}catch(e){}}
    if(!w){document.body.classList.add('fs')}
  };
  var mode='both';
  document.querySelectorAll('.seg button').forEach(function(btn){btn.onclick=function(){mode=btn.dataset.m;document.querySelectorAll('.seg button').forEach(function(x){x.classList.toggle('on',x===btn)});layout()}});
  var stage=document.getElementById('stage'),desk=document.getElementById('desk'),phone=document.getElementById('phone'),ds=document.getElementById('dscreen'),ps=document.getElementById('pscreen');
  function layout(){
    var vw=document.documentElement.clientWidth,vh=window.innerHeight,hh=document.querySelector('header').offsetHeight;
    var pad=vw<700?16:36;stage.style.padding=pad+'px';

    desk.classList.toggle('hidden',mode==='phone');phone.classList.toggle('hidden',mode==='desktop');
