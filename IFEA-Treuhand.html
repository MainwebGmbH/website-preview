<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>IFEA Treuhand GmbH | Entwurf der neuen Startseite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#E9E7E2;color:#1A1A1A;font-family:'Hanken Grotesk',system-ui,sans-serif}
body{display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 24px;padding:16px clamp(16px,2.5vw,36px);background:#E9E7E2;border-bottom:1px solid #D6D3CC}
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.logo{background:#fff;border-radius:8px;height:62px;min-width:62px;padding:8px 14px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.logo img{max-height:46px;max-width:170px;width:auto;display:block}
.name{font-size:clamp(18px,1.7vw,24px);font-weight:700;line-height:1.2}
.sub{margin-top:3px;font-size:clamp(14px,1.2vw,17px);color:#5E5B55}
.tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.seg{display:flex;background:#F4F3EF;border:1px solid #D6D3CC;border-radius:8px;padding:4px}
.seg button{height:42px;padding:0 18px;border:0;border-radius:6px;background:transparent;color:#3A3833;font:600 16px 'Hanken Grotesk',sans-serif;cursor:pointer}
.seg button.on{background:#1A1A1A;color:#fff}
.full{height:50px;display:flex;align-items:center;gap:9px;padding:0 20px;border:1.5px solid #1A1A1A;border-radius:8px;background:transparent;color:#1A1A1A;font:600 16px 'Hanken Grotesk',sans-serif;cursor:pointer;white-space:nowrap}
.full:hover{background:#1A1A1A;color:#fff}
main{flex:1;display:flex;justify-content:center;gap:44px;padding:36px}
.desk{display:flex;flex-direction:column;background:#fff;border:1px solid #D6D3CC;border-radius:12px;overflow:hidden;box-shadow:0 30px 60px -30px rgba(0,0,0,.25);min-width:0}
.bar{height:46px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 16px;background:#F4F3EF;border-bottom:1px solid #DEDBD4;position:relative}
.bar i{width:12px;height:12px;border-radius:50%;background:#D3D0C9}
.url{position:absolute;left:50%;transform:translateX(-50%);width:min(52%,620px);height:30px;border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;color:#5E5B55;white-space:nowrap;overflow:hidden}
.screen{position:relative;flex:1;min-height:0;overflow:hidden;background:#fff}
.screen iframe,.pscreen iframe{position:absolute;top:0;left:0;border:0;background:#fff}
.phone{position:relative;flex-shrink:0;padding:12px;background:#141414;box-shadow:0 30px 60px -25px rgba(0,0,0,.45)}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:34%;height:24px;border-radius:0 0 16px 16px;background:#141414;z-index:2}
.pscreen{position:relative;overflow:hidden;background:#fff}
.hidden{display:none!important}
.load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8A867E;font-size:15px}
</style>
</head>

<style>
:root{--p:#394B88;--ph:#2C3B6D;--gold:#B79A63;--dk:#141B36;--dk2:#1C2547;--ink:#1F2333;--mut:#5B6072;--line:#E4E5EC;--soft:#F5F5F8;--ivory:#FAF8F4;--fh:'Cormorant Garamond',Georgia,serif;--fu:'Montserrat',system-ui,sans-serif;--fb:'PT Sans',system-ui,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--fb);color:var(--ink);background:#fff;font-size:17.5px;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3{font-family:var(--fh);font-weight:600;margin:0;line-height:1.05;color:var(--dk);letter-spacing:-.005em}
h2{font-size:clamp(38px,4.6vw,62px)}
h1 em,h2 em{font-style:italic;color:var(--p)}
p{margin:0 0 1em}
.wrap{max-width:1220px;margin:0 auto;padding:0 32px}
section{padding:120px 0;position:relative}
.eyebrow{display:inline-flex;align-items:center;gap:14px;font:600 11.5px/1 var(--fu);letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:24px}
.eyebrow:before{content:"";width:34px;height:1px;background:currentColor}
.lead{font-size:clamp(18px,1.45vw,20px);color:#3D4152;line-height:1.65}
.btn{display:inline-flex;align-items:center;gap:10px;height:56px;padding:0 30px;font:600 13.5px/1 var(--fu);letter-spacing:.1em;text-transform:uppercase;text-decoration:none;cursor:pointer;border:1px solid transparent;transition:background .25s,color .25s,transform .25s;white-space:nowrap}
.btn-p{background:var(--dk2);color:#fff}
.btn-p:hover{background:var(--p);transform:translateY(-2px)}
.btn-o{border-color:var(--dk2);color:var(--dk2)}
.btn-o:hover{background:var(--dk2);color:#fff}
.btn-g{background:var(--gold);color:#fff}
.btn-g:hover{background:#A5884F}
.btn-ow{border-color:rgba(255,255,255,.5);color:#fff}
.btn-ow:hover{background:#fff;color:var(--dk)}
.rv{opacity:0;transform:translateY(22px);transition:opacity 1s,transform 1s}
.rv.in{opacity:1;transform:none}
.sec-head{display:grid;grid-template-columns:1.1fr .9fr;gap:60px;align-items:end;margin-bottom:64px}
.sec-head p{margin:0;color:var(--mut)}

.hdr{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;height:86px;gap:20px}
.logo img{height:46px;width:auto}
.nav{display:flex;gap:34px}
.nav a{font:600 12.5px var(--fu);letter-spacing:.14em;text-transform:uppercase;text-decoration:none;color:var(--ink)}
.nav a:hover{color:var(--p)}
.hcta{display:flex;align-items:center;gap:20px}
.hcta .tel{font:600 14px var(--fu);text-decoration:none;color:var(--dk2)}
.hcta .btn{height:46px;padding:0 22px;font-size:12px}
.burger{display:none;width:46px;height:46px;border:1px solid var(--line);background:#fff;align-items:center;justify-content:center;cursor:pointer}
.mnav{display:none}

/* hero */
.hero{padding:80px 0 0;background:linear-gradient(180deg,#fff 0%,var(--ivory) 100%)}
.hgrid{display:grid;grid-template-columns:1.1fr .9fr;gap:70px;align-items:end}
.hero h1{font-size:clamp(54px,7vw,104px);line-height:.95;letter-spacing:-.015em}
.hero h1 em{display:block}
.hero .lead{max-width:520px;margin:30px 0 38px}
.hbtns{display:flex;flex-wrap:wrap;gap:12px}
.htrust{display:flex;align-items:center;gap:22px;margin-top:44px;padding:18px 0 0;border-top:1px solid var(--line);max-width:520px}
.htrust img{height:44px;width:auto;filter:none}
.htrust span{font-size:14px;color:var(--mut);line-height:1.45}
.hph{position:relative;align-self:stretch;display:flex;align-items:flex-end}
.hph .fr{position:relative;width:100%;aspect-ratio:4/5;overflow:hidden;background:#d9d9d9}
.hph .fr img{width:100%;height:100%;object-fit:cover;object-position:center 20%}
.hph:before{content:"";position:absolute;left:-26px;top:26px;bottom:-26px;width:60%;border:1px solid var(--gold);z-index:0}
.hph .fr{z-index:1}
.hname{position:absolute;z-index:2;right:-24px;bottom:40px;background:var(--dk2);color:#fff;padding:20px 24px;min-width:270px}
.hname b{display:block;font:600 24px var(--fh)}
.hname span{display:block;font:600 11px var(--fu);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-top:4px}

/* stats — clean, evenly distributed */
.stats{padding:0;background:var(--dk);color:#fff;margin-top:90px}
.stats .wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.st{padding:44px 30px;border-left:1px solid rgba(255,255,255,.12);display:flex;flex-direction:column;justify-content:center}
.st:first-child{border-left:0}
.st b{display:block;font:600 40px/1 var(--fh);white-space:nowrap;color:#fff}
.st b i{font-style:italic;color:var(--gold)}
.st span{display:block;margin-top:12px;font:600 11.5px/1.5 var(--fu);letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.62)}

/* services */
.sgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
.sv{position:relative;padding:44px 42px 40px;border:1px solid var(--line);background:#fff;transition:border-color .3s,box-shadow .3s}
.sv:hover{border-color:var(--gold);box-shadow:0 40px 70px -50px rgba(20,27,54,.5)}
.sv .no{position:absolute;right:36px;top:30px;font:500 italic 56px/1 var(--fh);color:#EEEAE1}
.sv .k{font:600 11px var(--fu);letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.sv h3{font-size:34px;margin-bottom:10px}
.sv>p{color:var(--mut);margin-bottom:22px}
.sv ul{list-style:none;margin:0 0 26px;padding:0;display:grid;gap:10px}
.sv li{display:flex;gap:12px;font-size:16px}
.sv li:before{content:"";width:16px;height:1px;background:var(--p);margin-top:13px;flex-shrink:0}
.sv a{font:600 12px var(--fu);letter-spacing:.14em;text-transform:uppercase;color:var(--dk2);text-decoration:none;border-bottom:1px solid var(--gold);padding-bottom:4px}

/* eins a */
.einsa{background:var(--ivory)}
.egrid{display:grid;grid-template-columns:.9fr 1.1fr;gap:80px;align-items:center}
.eimg{position:relative}
.eimg img{width:100%;aspect-ratio:4/5;object-fit:cover;filter:grayscale(1) contrast(1.05)}
.eimg .seal{position:absolute;right:-34px;top:40px;width:150px;height:150px;border-radius:50%;background:var(--dk2);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 30px 50px -20px rgba(20,27,54,.6);border:1px solid var(--gold);outline:6px solid var(--ivory)}
.eimg .seal b{font:600 italic 40px/1 var(--fh);color:var(--gold)}
.eimg .seal span{font:600 10px var(--fu);letter-spacing:.18em;text-transform:uppercase;margin-top:6px}
.einsa blockquote{margin:30px 0;padding:0 0 0 26px;border-left:2px solid var(--gold);font:500 italic 28px/1.35 var(--fh);color:var(--dk)}
.vals{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-top:10px}
.vals div{background:#fff;padding:22px 20px}
.vals b{display:block;font:600 22px var(--fh);color:var(--dk)}
.vals span{font-size:14.5px;color:var(--mut);line-height:1.5;display:block;margin-top:4px}

/* trust band */
.trust{background:var(--dk2);color:#fff;padding:90px 0}
.tgrid{display:grid;grid-template-columns:1fr 1.4fr;gap:70px;align-items:center}
.tlogo{border:1px solid rgba(255,255,255,.14);padding:40px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.tlogo img{width:300px;max-width:100%}
.tlogo small{font:600 10.5px var(--fu);letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.trust h2{color:#fff}
.trust h2 em{color:var(--gold)}
.trust .lead{color:rgba(255,255,255,.78);margin:22px 0 30px}
.tlist{display:grid;grid-template-columns:1fr 1fr;gap:18px 30px}
.tlist>div{display:flex;gap:14px;align-items:flex-start}
.tlist i{width:28px;height:28px;border:1px solid var(--gold);color:var(--gold);display:flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:50%}
.tlist b{display:block;font:600 19px var(--fh)}
.tlist span{font-size:14.5px;color:rgba(255,255,255,.66)}

/* border */
.border{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center}
.map{position:relative;aspect-ratio:1/1;background:var(--soft);border:1px solid var(--line);overflow:hidden}
.map svg{width:100%;height:100%}

/* team */
.team{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.tm{display:grid;grid-template-columns:.9fr 1.1fr;background:var(--ivory);border:1px solid var(--line)}
.tm .ph{overflow:hidden;background:#ddd}
.tm .ph img{width:100%;height:100%;object-fit:cover;object-position:center 15%;min-height:420px;transition:transform .9s}
.tm:hover .ph img{transform:scale(1.03)}
.tm .tb{padding:40px 34px;display:flex;flex-direction:column}
.tm .role{font:600 11px var(--fu);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.tm h3{font-size:34px;margin-bottom:12px}
.tm p{color:var(--mut);font-size:16px}
.tm .ct{margin-top:auto;padding-top:20px;border-top:1px solid var(--line);display:grid;gap:6px}
.tm .ct a{font:600 13.5px var(--fu);text-decoration:none;color:var(--dk2)}
.tm .ct a:hover{color:var(--p)}

/* process */
.proc{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--line)}
.pc{padding:40px 36px 0 0}
.pc .n{font:500 italic 64px/1 var(--fh);color:var(--gold);margin-bottom:18px}
.pc h3{font-size:28px;margin-bottom:10px}
.pc p{color:var(--mut);margin:0}

/* band */
.band{padding:160px 0;overflow:hidden;color:#fff}
.band img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1)}
.band:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(20,27,54,.95),rgba(20,27,54,.65))}
.band .wrap{position:relative;z-index:2}
.band h2{color:#fff;font-size:clamp(42px,5.6vw,80px);max-width:820px}
.band h2 em{color:var(--gold)}
.band p{font-size:19px;color:rgba(255,255,255,.8);max-width:560px;margin:20px 0 34px}

/* contact */
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:start}
.cl{margin-top:30px;border-top:1px solid var(--line)}
.ci{display:grid;grid-template-columns:140px 1fr;gap:20px;padding:18px 0;border-bottom:1px solid var(--line);text-decoration:none}
.ci small{font:600 11px var(--fu);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);padding-top:4px}
.ci b{font-size:17px;font-weight:700}
.ci span{font-size:16px}
.form{background:var(--ivory);padding:46px;border:1px solid var(--line)}
.form h3{font-size:36px;margin-bottom:6px}
.form>p{color:var(--mut);font-size:15.5px}
.frr{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fl{display:block;margin-bottom:16px}
.fl span{display:block;font:600 10.5px var(--fu);letter-spacing:.18em;text-transform:uppercase;margin-bottom:8px}
.fl input,.fl textarea,.fl select{width:100%;font:400 16px var(--fb);padding:14px 16px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:0}
.fl input:focus,.fl textarea:focus,.fl select:focus{outline:0;border-color:var(--dk2)}
.fl textarea{min-height:120px;resize:vertical}
.form .btn{width:100%;justify-content:center}
.note{font-size:12.5px;color:var(--mut);margin:12px 0 0;text-align:center}

.ftr{background:var(--dk);color:rgba(255,255,255,.7);padding:80px 0 36px;font-size:15px}
.fg{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:40px}
.ftr .flogo{background:#fff;display:inline-block;padding:10px 14px;margin-bottom:18px}
.ftr .flogo img{height:36px;width:auto}
.ftr h4{color:#fff;font:600 11px var(--fu);letter-spacing:.2em;text-transform:uppercase;margin:0 0 16px}
.ftr a{color:rgba(255,255,255,.7);text-decoration:none}
.ftr a:hover{color:#fff}
.ftr ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.fts{margin-top:18px;height:46px;width:auto;opacity:.9}
.fb{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:56px;padding-top:24px;border-top:1px solid rgba(255,255,255,.1);font-size:13.5px}
.mbar{display:none}

@media (max-width:1080px){
  .nav,.hcta .tel{display:none}
  .burger{display:flex}
  .mnav.open{display:flex;position:fixed;inset:86px 0 0;background:#fff;z-index:49;flex-direction:column;padding:24px 32px}
  .mnav a{font:600 26px var(--fh);text-decoration:none;padding:14px 0;border-bottom:1px solid var(--line)}
  .hgrid,.egrid,.tgrid,.border,.cgrid{grid-template-columns:minmax(0,1fr)}
  .hph{max-width:520px;margin-left:26px}
  .sec-head{grid-template-columns:1fr;gap:18px}
  .stats .wrap{grid-template-columns:repeat(2,minmax(0,1fr))}
  .st:nth-child(3){border-left:0}
  .st:nth-child(n+3){border-top:1px solid rgba(255,255,255,.12)}
  .team{grid-template-columns:1fr}
  .fg{grid-template-columns:1fr 1fr}
  .eimg .seal{right:16px}
}
@media (max-width:700px){
  body{font-size:16.5px}
  .wrap{padding:0 20px}
  section{padding:84px 0}
  .hdr .wrap{height:72px}.logo img{height:42px}
  .mnav.open{inset:72px 0 0}
  .hcta .btn{display:none}
  .hero{padding-top:44px}
  .hbtns .btn{flex:1 1 100%;justify-content:center}
  .hph{margin:30px 0 0 14px}
  .hph:before{left:-14px;top:14px;bottom:-14px}
  .hname{right:-6px;bottom:20px;min-width:0;padding:14px 18px}
  .hname b{font-size:20px}
  .stats{margin-top:60px}
  .st{padding:30px 16px}
  .st b{font-size:30px}
  .st span{font-size:10.5px}
  .sgrid,.vals,.tlist,.proc,.frr{grid-template-columns:1fr}
  .sv{padding:34px 24px 30px}
  .sv h3{font-size:28px}
  .tm{grid-template-columns:1fr}
  .tm .ph img{min-height:0;aspect-ratio:4/5}
  .tm .tb{padding:28px 22px}
  .eimg .seal{width:118px;height:118px;right:10px;top:-30px}
  .eimg .seal b{font-size:30px}
  .tlogo{padding:28px}
  .pc{padding:30px 0 0}
  .ci{grid-template-columns:1fr;gap:4px}
  .form{padding:30px 20px}
  .fg{grid-template-columns:1fr}
  .band{padding:110px 0}
  .mbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:fixed;left:12px;right:12px;bottom:12px;z-index:60;transform:translateY(130%);transition:transform .35s}
  .mbar.show{transform:none}
  .mbar a{height:52px;display:flex;align-items:center;justify-content:center;font:600 12.5px var(--fu);letter-spacing:.1em;text-transform:uppercase;text-decoration:none;box-shadow:0 16px 30px -12px rgba(0,0,0,.45)}
  .mbar a:first-child{background:#fff;color:var(--dk2);border:1px solid var(--line)}
  .mbar a:last-child{background:var(--dk2);color:#fff}
  .ftr{padding-bottom:100px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>

    <h2>Von Konstanz in die Schweiz. <em>Wir begleiten Sie.</em></h2>
    <p class="lead" style="margin-top:22px">Unser Standort in Kreuzlingen liegt direkt an der Grenze zu Konstanz. Besonders interessant für Unternehmen aus Deutschland und der EU, die in der Schweiz Fuss fassen wollen.</p>
    <p style="color:var(--mut)">Wir begleiten Sie beim Markteintritt, bei Gründung und Buchhaltung nach Schweizer Recht – und arbeiten bei Bedarf mit unserem Partner in Deutschland zusammen.</p>

<script>
(function(){
  var html=document.getElementById('page').textContent.replace(/<\uE000/g,'<');
  var url=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));
  var df=document.getElementById('dframe'),pf=document.getElementById('pframe');
  df.src=url;pf.src=url;
  document.getElementById('full').onclick=function(){window.open(url,'_blank')};
  var mode='both';
  document.querySelectorAll('.seg button').forEach(function(btn){btn.onclick=function(){mode=btn.dataset.m;document.querySelectorAll('.seg button').forEach(function(x){x.classList.toggle('on',x===btn)});layout()}});
  var stage=document.getElementById('stage'),desk=document.getElementById('desk'),phone=document.getElementById('phone'),ds=document.getElementById('dscreen'),ps=document.getElementById('pscreen');
  function layout(){
    var vw=document.documentElement.clientWidth,vh=window.innerHeight,hh=document.querySelector('header').offsetHeight;
    var pad=vw<700?16:36;stage.style.padding=pad+'px';
    var availH=Math.max(560,vh-hh-pad*2);
    var row=vw>=1100&&mode==='both';
    stage.style.flexDirection=row?'row':'column';stage.style.alignItems=row?'flex-start':'center';
    desk.classList.toggle('hidden',mode==='phone');phone.classList.toggle('hidden',mode==='desktop');
    desk.style.flex=row?'1 1 auto':'0 0 auto';desk.style.width=row?'auto':'100%';
    desk.style.height=(row||mode==='desktop'?availH:Math.min(availH,Math.round(vw*0.62)))+'px';
    var s=Math.max(0.6,Math.min(mode==='phone'?1:0.92,(availH-24)/844,(vw-pad*2-24)/390));
    ps.style.width=Math.round(390*s)+'px';ps.style.height=Math.round(844*s)+'px';ps.style.borderRadius=Math.round(44*s)+'px';phone.style.borderRadius=Math.round(56*s)+'px';
    pf.style.width='390px';pf.style.height='844px';pf.style.zoom=s;
    var w=ds.clientWidth,h=ds.clientHeight,sc=(w||1000)/1440;df.style.width='1440px';df.style.height=Math.round((h||700)/sc)+'px';df.style.zoom=sc;
  }
  window.addEventListener('resize',layout);layout();setTimeout(layout,300);
  [df,pf].forEach(function(f){f.addEventListener('load',function(){var l=f.parentNode.querySelector('.load');if(l)l.remove()})});
})();
</script>
