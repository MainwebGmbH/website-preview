<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Meile Buchhaltung | Entwurf der neuen Startseite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#E9E7E2;color:#1A1A1A;font-family:'Hanken Grotesk',system-ui,sans-serif}
body{display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 24px;padding:16px clamp(16px,2.5vw,36px);background:#E9E7E2;border-bottom:1px solid #D6D3CC}
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.logo{background:#fff;border-radius:8px;height:62px;min-width:62px;padding:8px 14px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.logo img{max-height:46px;max-width:170px;width:auto;display:block}
.name{font-size:clamp(18px,1.7vw,24px);font-weight:700;line-height:1.2}
.sub{margin-top:3px;font-size:clamp(14px,1.2vw,17px);color:#5E5B55}
.tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.seg{display:flex;background:#F4F3EF;border:1px solid #D6D3CC;border-radius:8px;padding:4px}
.seg button{height:42px;padding:0 18px;border:0;border-radius:6px;background:transparent;color:#3A3833;font:600 16px 'Hanken Grotesk',sans-serif;cursor:pointer}
.seg button.on{background:#1A1A1A;color:#fff}
.full{height:50px;display:flex;align-items:center;gap:9px;padding:0 20px;border:1.5px solid #1A1A1A;border-radius:8px;background:transparent;color:#1A1A1A;font:600 16px 'Hanken Grotesk',sans-serif;cursor:pointer;white-space:nowrap}
.full:hover{background:#1A1A1A;color:#fff}
main{flex:1;display:flex;justify-content:center;gap:44px;padding:36px}
.desk{display:flex;flex-direction:column;background:#fff;border:1px solid #D6D3CC;border-radius:12px;overflow:hidden;box-shadow:0 30px 60px -30px rgba(0,0,0,.25);min-width:0}
.bar{height:46px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 16px;background:#F4F3EF;border-bottom:1px solid #DEDBD4;position:relative}
.bar i{width:12px;height:12px;border-radius:50%;background:#D3D0C9}
.url{position:absolute;left:50%;transform:translateX(-50%);width:min(52%,620px);height:30px;border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;color:#5E5B55;white-space:nowrap;overflow:hidden}
.screen{position:relative;flex:1;min-height:0;overflow:hidden;background:#fff}
.screen iframe,.pscreen iframe{position:absolute;top:0;left:0;border:0;background:#fff}
.phone{position:relative;flex-shrink:0;padding:12px;background:#141414;box-shadow:0 30px 60px -25px rgba(0,0,0,.45)}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:34%;height:24px;border-radius:0 0 16px 16px;background:#141414;z-index:2}
.pscreen{position:relative;overflow:hidden;background:#fff}
.hidden{display:none!important}
.load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8A867E;font-size:15px}
</style>
</head>

h1,h2,h3{font-family:var(--fh);margin:0;color:var(--dk);letter-spacing:-.025em;line-height:1.06;font-weight:700}
h2{font-size:clamp(32px,3.8vw,50px)}
h1 em,h2 em{font-style:normal;color:var(--p)}
p{margin:0 0 1em}
.wrap{max-width:1200px;margin:0 auto;padding:0 32px}
section{padding:96px 0;position:relative}
.s-soft{background:var(--soft)}
.s-warm{background:var(--warm)}
.s-dark{background:var(--dk);color:#fff}
.s-dark h2,.s-dark h3{color:#fff}
.s-dark h2 em{color:var(--sky)}
.eyebrow{display:inline-flex;align-items:center;gap:12px;font:700 12.5px/1 var(--fh);letter-spacing:.16em;text-transform:uppercase;color:var(--p);margin-bottom:18px}
.eyebrow:before{content:"";width:28px;height:2px;background:var(--sky)}
.s-dark .eyebrow{color:var(--sky)}
.lead{font-size:clamp(18px,1.4vw,20px);color:#3B4354;line-height:1.6}
.btn{display:inline-flex;align-items:center;gap:10px;height:54px;padding:0 26px;border-radius:12px;font:700 16px/1 var(--fh);text-decoration:none;cursor:pointer;border:1.5px solid transparent;transition:transform .2s,background .2s,box-shadow .2s,color .2s;white-space:nowrap}
.btn-p{background:var(--p);color:#fff;box-shadow:0 14px 28px -14px var(--p)}
.btn-p:hover{background:var(--ph);transform:translateY(-2px)}
.btn-o{border-color:var(--dk);color:var(--dk)}
.btn-o:hover{background:var(--dk);color:#fff}
.btn-w{background:#fff;color:var(--dk)}
.btn-ow{border-color:rgba(255,255,255,.55);color:#fff}
.btn-ow:hover{background:#fff;color:var(--dk)}
.rv{opacity:0;transform:translateY(22px);transition:opacity .8s,transform .8s}
.rv.in{opacity:1;transform:none}
.sec-head{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:end;margin-bottom:48px}
.sec-head p{margin:0;color:var(--mut)}

.hdr{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;height:80px;gap:20px}
.logo img{height:40px;width:auto}
.nav{display:flex;gap:28px}
.nav a{font:600 15.5px var(--fh);text-decoration:none;color:var(--dk)}
.nav a:hover{color:var(--p)}
.hcta{display:flex;align-items:center;gap:16px}
.hcta .tel{font:700 15.5px var(--fh);text-decoration:none;color:var(--dk)}
.hcta .btn{height:46px;padding:0 20px;font-size:15px}
.burger{display:none;width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:#fff;align-items:center;justify-content:center;cursor:pointer}
.mnav{display:none}

/* hero */
.hero{padding:64px 0 0;background:linear-gradient(180deg,#fff 0%,var(--soft) 100%)}
.hgrid{display:grid;grid-template-columns:1.1fr .9fr;gap:60px;align-items:center}
.hero h1{font-size:clamp(46px,5.6vw,78px);letter-spacing:-.035em;line-height:1}
.hero .lead{margin:24px 0 32px;max-width:540px}
.hbtns{display:flex;flex-wrap:wrap;gap:12px}
.hchecks{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:30px;font:600 15px var(--fh);color:var(--dk)}
.hchecks span{display:flex;align-items:center;gap:8px}
.hchecks svg{color:var(--p)}
.himg{position:relative}
.himg .main{border-radius:24px;overflow:hidden;aspect-ratio:4/5;box-shadow:0 40px 80px -40px rgba(22,38,79,.55)}
.himg .main img{width:100%;height:100%;object-fit:cover}
.himg .chip{position:absolute;left:-36px;bottom:42px;background:#fff;border-radius:16px;padding:16px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 24px 50px -22px rgba(22,38,79,.45)}
.himg .chip .ic{width:46px;height:46px;border-radius:12px;background:var(--soft);color:var(--p);display:flex;align-items:center;justify-content:center}
.himg .chip b{display:block;font:800 22px/1.1 var(--fh);color:var(--dk);white-space:nowrap}
.himg .chip span{display:block;font-size:13.5px;color:var(--mut);white-space:nowrap}
.himg .year{position:absolute;right:-20px;top:30px;background:var(--p);color:#fff;border-radius:16px;padding:14px 18px;text-align:center;box-shadow:0 20px 40px -18px var(--p)}
.himg .year b{display:block;font:800 30px/1 var(--fh)}
.himg .year span{display:block;font-size:12px;opacity:.9;margin-top:4px}

/* facts */
.facts{padding:0;background:var(--dk);color:#fff;margin-top:72px}
.facts .wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.fc{padding:36px 26px;border-left:1px solid rgba(255,255,255,.12)}
.fc:first-child{border-left:0;padding-left:0}
.fc b{display:block;font:800 38px/1 var(--fh);white-space:nowrap}
.fc b i{font-style:normal;color:var(--sky)}
.fc span{display:block;margin-top:10px;font-size:14.5px;color:rgba(255,255,255,.72);line-height:1.4}

/* services */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.sv{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;transition:transform .3s,box-shadow .3s}
.sv:hover{transform:translateY(-4px);box-shadow:0 30px 60px -36px rgba(22,38,79,.45)}
.sv .im{aspect-ratio:16/10;overflow:hidden}
.sv .im img{width:100%;height:100%;object-fit:cover;transition:transform .8s}
.sv:hover .im img{transform:scale(1.04)}
.sv .bd{padding:26px 26px 24px;display:flex;flex-direction:column;flex:1}
.sv .k{font:700 12px var(--fh);letter-spacing:.14em;text-transform:uppercase;color:var(--p);margin-bottom:8px}
.sv h3{font-size:23px;margin-bottom:8px}
.sv p{color:var(--mut);font-size:16px}
.sv ul{list-style:none;padding:0;margin:4px 0 20px;display:grid;gap:8px;font-size:15.5px}
.sv li{display:flex;gap:10px}
.sv li svg{flex-shrink:0;margin-top:5px;color:var(--p)}
.sv a{margin-top:auto;font:700 15px var(--fh);color:var(--p);text-decoration:none}

/* prices */
.pgrid{display:grid;grid-template-columns:.85fr 1.15fr;gap:60px;align-items:start}
.pgrid h2{margin-bottom:18px}
.pintro{color:var(--mut);margin-bottom:26px}
.pnote{display:flex;gap:14px;align-items:center;margin-top:30px;padding:18px 20px;border-radius:16px;background:#fff;border:1px solid var(--line)}
.pnote .ic{width:44px;height:44px;border-radius:12px;background:var(--soft);color:var(--p);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pnote b{display:block;font:700 16px var(--fh);color:var(--dk)}
.pnote span{font-size:14.5px;color:var(--mut)}
.plist{background:#fff;border:1px solid var(--line);border-radius:20px;padding:10px 30px 22px;box-shadow:0 30px 60px -44px rgba(22,38,79,.4)}
.plist h3{font-size:20px;padding:18px 0 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.plist h3 small{font:500 13.5px var(--fb);color:var(--mut)}
.prow{display:grid;grid-template-columns:1fr auto;gap:6px 24px;padding:18px 0;border-bottom:1px solid var(--line)}
.prow .pn{font:600 17px var(--fh);color:var(--dk)}
.prow .pp{font:800 18px var(--fh);color:var(--p);white-space:nowrap;text-align:right}
.prow .pd{grid-column:1/-1;font-size:14.5px;color:var(--mut);line-height:1.5}
.pfoot{margin:16px 0 0;font-size:13.5px;color:var(--mut)}

/* about */
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:72px;align-items:center}
.aimg{position:relative}
.aimg img{border-radius:22px;width:100%;aspect-ratio:3/2;object-fit:cover}
.aimg .tag{position:absolute;left:24px;bottom:-26px;background:var(--dk);color:#fff;border-radius:16px;padding:18px 22px}
.aimg .tag b{display:block;font:800 30px/1 var(--fh)}
.aimg .tag span{font-size:13.5px;opacity:.8}
.quote{margin:26px 0;padding:22px 24px;border-radius:16px;background:var(--warm);border-left:4px solid var(--sky)}
.quote p{margin:0 0 6px;font:600 19px/1.45 var(--fh);color:var(--dk)}
.quote span{font-size:13.5px;color:var(--mut)}
.vals{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px}
.vals div{display:flex;gap:10px;align-items:flex-start;font-size:16px}
.vals svg{flex-shrink:0;margin-top:4px;color:var(--p)}

/* team */
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.tm{background:#fff;border-radius:22px;overflow:hidden;display:grid;grid-template-columns:.9fr 1.1fr;border:1px solid var(--line)}
.tm .ph{overflow:hidden;background:var(--soft)}
.tm .ph img{width:100%;height:100%;object-fit:cover;min-height:300px}
.tm .tb{padding:30px 28px;display:flex;flex-direction:column}
.tm .role{font:700 12px var(--fh);letter-spacing:.14em;text-transform:uppercase;color:var(--p);margin-bottom:8px}
.tm h3{font-size:26px;margin-bottom:10px}
.tm p{color:var(--mut);font-size:16px}
.tm .ct{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);display:grid;gap:4px}
.tm .ct a{font:700 15px var(--fh);text-decoration:none;color:var(--dk)}
.tm .ct a:hover{color:var(--p)}
.tband{margin-top:24px;display:grid;grid-template-columns:1.1fr .9fr;border-radius:22px;overflow:hidden;background:var(--dk);color:#fff}
.tband img{width:100%;height:100%;object-fit:cover;min-height:320px}
.tband .tx{padding:44px 40px;display:flex;flex-direction:column;justify-content:center}
.tband h3{color:#fff;font-size:28px;margin-bottom:12px}
.tband p{color:rgba(255,255,255,.78);margin:0 0 22px}

/* kurs */
.kurs{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}
.kcard{background:#fff;border-radius:22px;padding:36px;border:1px solid var(--line);position:relative}
.kcard .badge{position:absolute;right:24px;top:-18px;background:var(--sky);color:var(--dk);font:800 14px var(--fh);padding:8px 14px;border-radius:999px}
.kcard h3{font-size:26px;margin-bottom:10px}
.kcard ul{list-style:none;padding:0;margin:16px 0 24px;display:grid;gap:10px}
.kcard li{display:flex;gap:10px}
.kcard li svg{color:var(--p);flex-shrink:0;margin-top:5px}
.kcard .price{display:flex;align-items:baseline;gap:8px;margin-bottom:20px}
.kcard .price b{font:800 34px var(--fh);color:var(--p)}
.kcard .price span{color:var(--mut);font-size:14.5px}
.kimg img{border-radius:22px;width:100%;aspect-ratio:4/5;object-fit:cover}

/* steps */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.st{padding:30px 28px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.st .n{width:46px;height:46px;border-radius:12px;background:var(--sky);color:var(--dk);display:flex;align-items:center;justify-content:center;font:800 19px var(--fh);margin-bottom:18px}
.st h3{font-size:22px;margin-bottom:8px}
.st p{color:rgba(255,255,255,.75);margin:0;font-size:16px}
.st a{color:#fff;font-weight:700}

/* contact */
.cgrid{display:grid;grid-template-columns:.95fr 1.05fr;gap:60px;align-items:start}
.cl{display:grid;gap:10px;margin-top:26px}
.ci{display:flex;gap:16px;align-items:center;padding:18px 20px;border-radius:16px;background:#fff;border:1px solid var(--line);text-decoration:none}
.ci .ic{width:44px;height:44px;border-radius:12px;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ci small{display:block;font:700 11.5px var(--fh);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.ci b{font:700 17px var(--fh);color:var(--dk)}
.form{background:#fff;border-radius:22px;padding:38px;border:1px solid var(--line);box-shadow:0 40px 80px -50px rgba(22,38,79,.45)}
.form h3{font-size:28px;margin-bottom:6px}
.form>p{color:var(--mut);font-size:15.5px}
.frr{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fl{display:block;margin-bottom:14px}
.fl span{display:block;font:700 13.5px var(--fh);margin-bottom:7px;color:var(--dk)}
.fl input,.fl textarea,.fl select{width:100%;font:500 16px var(--fb);padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--soft);color:var(--ink)}
.fl input:focus,.fl textarea:focus,.fl select:focus{outline:0;border-color:var(--p);background:#fff}
.fl textarea{min-height:110px;resize:vertical}
.form .btn{width:100%;justify-content:center}
.note{font-size:12.5px;color:var(--mut);margin:12px 0 0;text-align:center}

.ftr{background:var(--dk);color:rgba(255,255,255,.72);padding:70px 0 34px;font-size:15px}
.fg{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:40px}
.ftr .flogo{background:#fff;display:inline-block;padding:10px 14px;border-radius:12px;margin-bottom:16px}
.ftr .flogo img{height:34px;width:auto}
.ftr h4{color:#fff;font:700 12.5px var(--fh);letter-spacing:.16em;text-transform:uppercase;margin:0 0 14px}
.ftr a{color:rgba(255,255,255,.72);text-decoration:none}
.ftr a:hover{color:#fff}
.ftr ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.fb{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:48px;padding-top:22px;border-top:1px solid rgba(255,255,255,.1);font-size:13.5px}
.mbar{display:none}

@media (max-width:1080px){
  .nav,.hcta .tel{display:none}
  .burger{display:flex}
  .mnav.open{display:flex;position:fixed;inset:80px 0 0;background:#fff;z-index:49;flex-direction:column;padding:24px 32px}
  .mnav a{font:700 22px var(--fh);color:var(--dk);text-decoration:none;padding:14px 0;border-bottom:1px solid var(--line)}
  .hgrid,.pgrid,.agrid,.kurs,.cgrid{grid-template-columns:minmax(0,1fr)}
  .himg{max-width:520px;margin:0 30px}
  .sec-head{grid-template-columns:1fr;gap:16px}
  .sgrid{grid-template-columns:1fr 1fr}
  .tgrid{grid-template-columns:1fr}
  .facts .wrap{grid-template-columns:repeat(2,minmax(0,1fr))}
  .fc:nth-child(3){border-left:0;padding-left:0}
  .fc:nth-child(n+3){border-top:1px solid rgba(255,255,255,.12)}
  .fg{grid-template-columns:1fr 1fr}
  .kimg{display:none}
}
@media (max-width:700px){
  body{font-size:16.5px}
  .wrap{padding:0 20px}
  section{padding:72px 0}
  .hdr .wrap{height:70px}.logo img{height:32px}
  .mnav.open{inset:70px 0 0}
  .hcta .btn{display:none}
  .hero{padding-top:36px}
  .hbtns .btn{flex:1 1 100%;justify-content:center}
  .himg{margin:10px 14px 0}
  .himg .chip{left:-14px;bottom:24px;padding:12px 14px}
  .himg .chip b{font-size:18px}
  .himg .year{right:-12px;top:18px}
  .facts{margin-top:56px}
  .fc{padding:26px 14px}
  .fc b{font-size:28px}
  .sgrid,.steps,.frr,.vals{grid-template-columns:1fr}
  .plist{padding:6px 18px 18px}
  .prow .pn{font-size:16px}.prow .pp{font-size:16px}
  .tm,.tband{grid-template-columns:1fr}
  .tm .ph img{min-height:0;aspect-ratio:4/3}
  .tband img{min-height:0;aspect-ratio:3/2}
  .tband .tx{padding:28px 22px}
  .kcard{padding:30px 22px}
  .form{padding:26px 20px}
  .fg{grid-template-columns:1fr}
  .mbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:fixed;left:12px;right:12px;bottom:12px;z-index:60;transform:translateY(130%);transition:transform .35s}
  .mbar.show{transform:none}
  .mbar a{height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font:700 15px var(--fh);text-decoration:none;box-shadow:0 16px 30px -12px rgba(22,38,79,.5)}
  .mbar a:first-child{background:#fff;color:var(--dk);border:1px solid var(--line)}
  .mbar a:last-child{background:var(--p);color:#fff}
  .ftr{padding-bottom:100px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>

    <h2>Quer- und <em>vernetzt gedacht.</em></h2>
    <p class="lead" style="margin-top:20px">Meile Buchhaltung wurde 1993 von Konrad Meile gegründet. Durch die langjährige und vielseitige Arbeit in verschiedensten Bereichen und Firmen können wir uns in fast jede Lage versetzen – und mit Ihnen gute und machbare Lösungen finden.</p>
    <div class="quote"><p>«Weitsichtiges Planen und Handeln ist gerade in schwierigen Situationen wichtig, jedoch auch bei gutem Geschäftsgang hilfreich.»</p><span>Konrad Meile, Gründer</span></div>

  var mode='both';
  document.querySelectorAll('.seg button').forEach(function(btn){btn.onclick=function(){mode=btn.dataset.m;document.querySelectorAll('.seg button').forEach(function(x){x.classList.toggle('on',x===btn)});layout()}});
  var stage=document.getElementById('stage'),desk=document.getElementById('desk'),phone=document.getElementById('phone'),ds=document.getElementById('dscreen'),ps=document.getElementById('pscreen');
  function layout(){
    var vw=document.documentElement.clientWidth,vh=window.innerHeight,hh=document.querySelector('header').offsetHeight;
    var pad=vw<700?16:36;stage.style.padding=pad+'px';
    var availH=Math.max(560,vh-hh-pad*2);
    var row=vw>=1100&&mode==='both';
    stage.style.flexDirection=row?'row':'column';stage.style.alignItems=row?'flex-start':'center';
    desk.classList.toggle('hidden',mode==='phone');phone.classList.toggle('hidden',mode==='desktop');
    desk.style.flex=row?'1 1 auto':'0 0 auto';desk.style.width=row?'auto':'100%';
    desk.style.height=(row||mode==='desktop'?availH:Math.min(availH,Math.round(vw*0.62)))+'px';
    var s=Math.max(0.6,Math.min(mode==='phone'?1:0.92,(availH-24)/844,(vw-pad*2-24)/390));
    ps.style.width=Math.round(390*s)+'px';ps.style.height=Math.round(844*s)+'px';ps.style.borderRadius=Math.round(44*s)+'px';phone.style.borderRadius=Math.round(56*s)+'px';
    pf.style.width='390px';pf.style.height='844px';pf.style.zoom=s;
    var w=ds.clientWidth,h=ds.clientHeight,sc=(w||1000)/1440;df.style.width='1440px';df.style.height=Math.round((h||700)/sc)+'px';df.style.zoom=sc;
  }
  window.addEventListener('resize',layout);layout();setTimeout(layout,300);
  [df,pf].forEach(function(f){f.addEventListener('load',function(){var l=f.parentNode.querySelector('.load');if(l)l.remove()})});
})();
</script>
</body>
</html>
