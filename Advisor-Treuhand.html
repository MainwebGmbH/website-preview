<head>
<meta charset="utf-8">

<title>Advisor Treuhand AG | Entwurf der neuen Startseite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#E9E7E2;color:#1A1A1A;font-family:'Hanken Grotesk',system-ui,sans-serif}
body{display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px 24px;padding:16px clamp(16px,2.5vw,36px);background:#E9E7E2;border-bottom:1px solid #D6D3CC}
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.logo{background:#fff;border-radius:8px;height:62px;min-width:62px;padding:8px 14px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.logo img{max-height:46px;max-width:170px;width:auto;display:block}
.name{font-size:clamp(18px,1.7vw,24px);font-weight:700;line-height:1.2}
.sub{margin-top:3px;font-size:clamp(14px,1.2vw,17px);color:#5E5B55}
.tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.seg{display:flex;background:#F4F3EF;border:1px solid #D6D3CC;border-radius:8px;padding:4px}
.seg button{height:42px;padding:0 18px;border:0;border-radius:6px;background:transparent;color:#3A3833;font:600 16px 'Hanken Grotesk',sans-serif;cursor:pointer}
.seg button.on{background:#1A1A1A;color:#fff}
.full{height:50px;display:flex;align-items:center;gap:9px;padding:0 20px;border:1.5px solid #1A1A1A;border-radius:8px;background:transparent;color:#1A1A1A;font:600 16px 'Hanken Grotesk',sans-serif;cursor:pointer;white-space:nowrap}
.full:hover{background:#1A1A1A;color:#fff}
main{flex:1;display:flex;justify-content:center;gap:44px;padding:36px}
.desk{display:flex;flex-direction:column;background:#fff;border:1px solid #D6D3CC;border-radius:12px;overflow:hidden;box-shadow:0 30px 60px -30px rgba(0,0,0,.25);min-width:0}
.bar{height:46px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 16px;background:#F4F3EF;border-bottom:1px solid #DEDBD4;position:relative}
.bar i{width:12px;height:12px;border-radius:50%;background:#D3D0C9}
.url{position:absolute;left:50%;transform:translateX(-50%);width:min(52%,620px);height:30px;border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;color:#5E5B55;white-space:nowrap;overflow:hidden}
.screen{position:relative;flex:1;min-height:0;overflow:hidden;background:#fff}
.screen iframe,.pscreen iframe{position:absolute;top:0;left:0;border:0;background:#fff}
.phone{position:relative;flex-shrink:0;padding:12px;background:#141414;box-shadow:0 30px 60px -25px rgba(0,0,0,.45)}
.notch{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:34%;height:24px;border-radius:0 0 16px 16px;background:#141414;z-index:2}
.pscreen{position:relative;overflow:hidden;background:#fff}
.hidden{display:none!important}
.load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8A867E;font-size:15px}

.fs header{display:none}.fs main{padding:0!important}</style>
</head>

<script id="page" type="text/plain"><!DOCTYPE html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">
<title>Advisor Treuhand AG | Buchhaltung, Steuern, Revision und Personal in Adliswil</title>
<meta name="description" content="Advisor Treuhand AG in Adliswil: Gesellschaftsgründungen, Buchhaltung, Abschlussberatung, Revision, Personalwesen, Unternehmensbewertung und Steuerberatung. Seit 1969.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#13284A;--blue:#294D81;--sky:#C9DAF2;--ice:#EEF3FA;--ink:#0E1A2E;--mut:#56617A;--line:#D9E1EC;--bg:#fff;--fh:'Inter Tight',system-ui,sans-serif;--fb:'Inter',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--fb);color:var(--ink);background:var(--bg);font-size:16.5px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{display:block;max-width:100%}
a{color:inherit}
h1,h2,h3{font-family:var(--fh);font-weight:800;letter-spacing:-.035em;line-height:1.02;color:var(--navy)}
.wrap{max-width:1280px;margin:0 auto;padding:0 40px}
.eb{display:inline-flex;align-items:center;gap:12px;font:600 12px/1 var(--fb);letter-spacing:.18em;text-transform:uppercase;color:var(--blue)}
.eb::before{content:"";width:28px;height:2px;background:currentColor}
.btn{display:inline-flex;align-items:center;gap:12px;padding:18px 28px;font:600 15px/1 var(--fh);letter-spacing:.01em;text-decoration:none;border:2px solid var(--navy);background:var(--navy);color:#fff;transition:background .25s,color .25s}
.btn:hover{background:var(--blue);border-color:var(--blue)}
.btn.ghost{background:transparent;color:var(--navy)}
.btn.ghost:hover{background:var(--navy);color:#fff}
.btn svg{width:18px;height:18px}
.arrow{transition:transform .25s}.btn:hover .arrow{transform:translateX(4px)}

/* header */
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;justify-content:space-between;height:84px}
.logo{display:inline-flex;flex-direction:column;align-items:flex-start;text-decoration:none;line-height:1}
.logo b{font:700 31px/1 var(--fb);letter-spacing:-.02em;color:var(--blue)}
.logo i{font:400 13px/1 var(--fb);font-style:normal;letter-spacing:.32em;color:var(--navy);margin-top:5px;padding-bottom:5px;border-bottom:1px solid var(--navy);padding-left:2px}
nav{display:flex;gap:34px}
nav a{text-decoration:none;font:500 15px/1 var(--fh);color:var(--ink);position:relative;padding:6px 0}
nav a::after{content:"";position:absolute;left:0;bottom:0;width:0;height:2px;background:var(--blue);transition:width .25s}
nav a:hover::after{width:100%}
.hr{display:flex;align-items:center;gap:26px}
.tel{display:flex;align-items:center;gap:9px;text-decoration:none;font:600 15px/1 var(--fh)}
.tel svg{width:17px;height:17px;color:var(--blue)}
.hd .btn{padding:14px 22px;font-size:14px}
.burger{display:none;background:none;border:0;width:44px;height:44px;cursor:pointer}
.burger span{display:block;width:24px;height:2px;background:var(--navy);margin:6px auto}
.drawer{display:none}

/* hero */
.hero{position:relative;border-bottom:1px solid var(--line)}
.hgrid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);min-height:calc(100vh - 84px);max-height:900px}
.htxt{padding:88px 64px 72px 0;display:flex;flex-direction:column;justify-content:center;max-width:640px;margin-left:auto;width:100%}
.hero h1{font-size:clamp(46px,6vw,88px);margin:30px 0 30px}
.hero h1 em{font-style:normal;color:var(--blue)}
.hero p.lead{font-size:19px;color:var(--mut);max-width:500px;margin-bottom:40px}
.hbtn{display:flex;gap:14px;flex-wrap:wrap}
.himg{position:relative;overflow:hidden;background:var(--ice)}
.himg img{width:100%;height:100%;object-fit:cover;object-position:center}
.hcard{position:absolute;left:0;bottom:0;background:var(--navy);color:#fff;padding:30px 36px;max-width:360px}
.hcard b{display:block;font:800 44px/1 var(--fh);letter-spacing:-.03em}
.hcard span{display:block;margin-top:10px;font-size:14.5px;color:rgba(255,255,255,.75);line-height:1.5}
.hwrap{padding-left:max(40px,calc((100vw - 1280px)/2 + 40px))}

/* facts */
.facts{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.fact{padding:34px 40px;border-right:1px solid var(--line)}
.fact:last-child{border-right:0}
.fact b{display:block;font:800 28px/1.1 var(--fh);letter-spacing:-.03em;color:var(--navy)}
.fact span{display:block;font-size:14px;color:var(--mut);margin-top:8px;line-height:1.45}

/* sections */
section{padding:120px 0}
.sh{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:60px;align-items:end;margin-bottom:64px}
.sh h2{font-size:clamp(38px,4.6vw,64px);margin-top:22px}
.sh p{color:var(--mut);font-size:17.5px;max-width:460px}

/* services */
.svc-s{background:var(--navy);color:rgba(255,255,255,.78)}
.svc-s h2,.svc-s h3{color:#fff}
.svc-s .eb{color:var(--sky)}
.svc-s .sh p{color:rgba(255,255,255,.66)}
.svc{border-top:1px solid rgba(255,255,255,.18)}
.sv{display:grid;grid-template-columns:90px minmax(0,1fr) minmax(0,1fr) 160px;gap:30px;align-items:start;padding:38px 0;border-bottom:1px solid rgba(255,255,255,.18);transition:background .3s}
.sv:hover{background:rgba(255,255,255,.035)}
.sv .n{font:700 15px/1 var(--fh);color:var(--sky);padding-top:10px;letter-spacing:.06em}
.sv h3{font-size:32px;letter-spacing:-.03em}
.sv .k{font-size:15px;color:rgba(255,255,255,.62);margin-top:10px}
.sv ul{list-style:none;display:grid;gap:9px;padding-top:6px}
.sv li{display:flex;gap:12px;font-size:15.5px;color:rgba(255,255,255,.85)}
.sv li::before{content:"";flex:0 0 7px;height:7px;background:var(--sky);margin-top:9px}
.sv a{justify-self:end;margin-top:6px;display:inline-flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font:600 14px/1 var(--fh);padding-bottom:6px;border-bottom:2px solid var(--sky)}
.sv a svg{width:16px;height:16px}

/* about */
.ab{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:90px;align-items:center}
.abimg{position:relative}
.abimg img{width:100%;aspect-ratio:4/5;object-fit:cover}
.abimg .tag{position:absolute;right:-1px;bottom:-1px;background:#fff;padding:24px 30px 0 30px}
.abimg .tag b{display:block;font:800 64px/1 var(--fh);letter-spacing:-.04em;color:var(--blue)}
.abimg .tag span{display:block;font-size:13.5px;color:var(--mut);margin-top:6px}
.ab h2{font-size:clamp(38px,4.6vw,64px);margin:22px 0 30px}
.ab p{color:var(--mut);font-size:17.5px;margin-bottom:18px;max-width:600px}
.quote{margin:36px 0;padding:30px 34px;background:var(--ice);border-left:4px solid var(--blue);font:600 23px/1.35 var(--fh);letter-spacing:-.02em;color:var(--navy)}
.quote small{display:block;font:600 11.5px/1 var(--fb);letter-spacing:.16em;text-transform:uppercase;color:var(--blue);margin-top:16px}
.cred{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cred div{display:flex;gap:14px;align-items:flex-start;padding:20px 22px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font:600 15px/1.4 var(--fh);color:var(--navy)}
.cred svg{flex:0 0 20px;width:20px;height:20px;color:var(--blue)}

/* team */
.team-s{background:var(--ice)}
.team{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
.tm{background:#fff}
.tm .ph{aspect-ratio:3/4;overflow:hidden;background:var(--line)}
.tm .ph img{width:100%;height:100%;object-fit:cover;object-position:center top;transition:transform .8s}
.tm:hover .ph img{transform:scale(1.03)}
.tm .tb{padding:28px 30px 30px;border-top:4px solid var(--blue)}
.tm h3{font-size:27px}
.tm .r{font:600 14px/1.4 var(--fh);color:var(--blue);margin-top:8px;letter-spacing:.01em}
.tm .q{font-size:14.5px;color:var(--mut);margin-top:10px;line-height:1.5}
.tm .m{display:flex;align-items:center;gap:10px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line);font-size:14px;text-decoration:none;color:var(--ink);word-break:break-word}
.tm .m svg{flex:0 0 16px;width:16px;height:16px;color:var(--blue)}

/* history */
.hist-s{padding-bottom:0}
.tl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:2px solid var(--navy)}
.tli{padding:34px 34px 0 0;position:relative}
.tli::before{content:"";position:absolute;top:-8px;left:0;width:14px;height:14px;background:var(--blue)}
.tli b{display:block;font:800 52px/1 var(--fh);letter-spacing:-.04em;color:var(--navy)}
.tli h3{font-size:19px;margin:16px 0 8px;letter-spacing:-.02em}
.tli p{font-size:15px;color:var(--mut)}

/* steps */
.steps-s{padding-top:110px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line)}
.st{padding:44px 40px;border-right:1px solid var(--line);position:relative}
.st:last-child{border-right:0;background:var(--navy);color:rgba(255,255,255,.75)}
.st:last-child h3{color:#fff}.st:last-child .no{color:var(--sky)}
.st .no{font:800 15px/1 var(--fh);color:var(--blue);letter-spacing:.08em}
.st h3{font-size:26px;margin:40px 0 12px}
.st p{font-size:15.5px;color:inherit}
.st:not(:last-child) p{color:var(--mut)}
.st a{color:inherit;font-weight:600}

/* contact */
.ct-s{background:var(--navy);color:rgba(255,255,255,.75)}
.ct{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:80px;align-items:start}
.ct h2{color:#fff;font-size:clamp(38px,4.6vw,62px);margin:22px 0 26px}
.ct .eb{color:var(--sky)}
.ct p{font-size:17.5px;max-width:440px}
.cl{margin-top:44px;border-top:1px solid rgba(255,255,255,.18)}
.cl a,.cl div{display:flex;align-items:center;gap:16px;padding:20px 0;border-bottom:1px solid rgba(255,255,255,.18);color:#fff;text-decoration:none;font:600 18px/1.3 var(--fh)}
.cl svg{flex:0 0 20px;width:20px;height:20px;color:var(--sky)}
form{background:#fff;padding:48px;color:var(--ink)}
form h3{font-size:26px;margin-bottom:6px}
form .demo{font-size:13px;color:var(--mut);margin-bottom:26px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.f{display:flex;flex-direction:column;gap:7px;margin-bottom:18px}
.f label{font:600 13px/1 var(--fh);color:var(--navy);letter-spacing:.02em}
.f label small{font-weight:400;color:var(--mut)}
.f input,.f select,.f textarea{font:inherit;font-size:15.5px;padding:14px 16px;border:1px solid var(--line);border-radius:0;background:#fff;color:var(--ink);width:100%}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
.f textarea{min-height:120px;resize:vertical}
form .btn{width:100%;justify-content:center;margin-top:6px}
form .note{font-size:12.5px;color:var(--mut);margin-top:14px;text-align:center}

/* footer */
footer{background:#0B1830;color:rgba(255,255,255,.6);padding:72px 0 36px;font-size:14.5px}
.fgd{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:40px;padding-bottom:48px;border-bottom:1px solid rgba(255,255,255,.12)}
footer .logo b{color:#fff}footer .logo i{color:rgba(255,255,255,.8);border-color:rgba(255,255,255,.5)}
footer h4{font:600 12px/1 var(--fb);letter-spacing:.16em;text-transform:uppercase;color:var(--sky);margin-bottom:18px}
footer a{text-decoration:none;color:rgba(255,255,255,.8)}
footer a:hover{color:#fff}
footer .ln{display:grid;gap:8px}
.fb{display:flex;justify-content:space-between;padding-top:26px;font-size:13px}

.rv{opacity:0;transform:translateY(24px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}

@media(max-width:1100px){
 nav{display:none}.tel span{display:none}
 .sv{grid-template-columns:60px minmax(0,1fr) minmax(0,1fr)}.sv a{display:none}
 .ab{gap:56px}.ct{gap:50px}
}
@media(max-width:860px){
 .wrap{padding:0 20px}
 .hd{height:70px}.logo b{font-size:26px}.logo i{font-size:11px}
 .hd .btn,.tel{display:none}.burger{display:block}
 .drawer.open{display:grid;gap:4px;padding:10px 20px 24px;border-top:1px solid var(--line)}
 .drawer a{padding:12px 0;text-decoration:none;font:600 18px/1.2 var(--fh);color:var(--navy);border-bottom:1px solid var(--line)}
 .hgrid{grid-template-columns:1fr;min-height:0;max-height:none}
 .hwrap{padding-left:0}
 .htxt{padding:52px 20px 44px;max-width:none}
 .hero h1{margin:22px 0}
 .hero p.lead{font-size:17px;margin-bottom:30px}
 .himg{aspect-ratio:4/3}
 .hcard{padding:20px 22px;max-width:260px}.hcard b{font-size:32px}.hcard span{font-size:13px}
 .facts{grid-template-columns:1fr 1fr}
 .fact{padding:24px 20px;border-bottom:1px solid var(--line)}
 .fact:nth-child(2n){border-right:0}.fact:nth-child(n+3){border-bottom:0}
 .fact b{font-size:22px}
 section{padding:80px 0}
 .sh{grid-template-columns:1fr;gap:18px;margin-bottom:40px}
 .sv{grid-template-columns:1fr;gap:12px;padding:30px 0}
 .sv .n{padding-top:0}.sv h3{font-size:27px}
 .ab{grid-template-columns:1fr;gap:44px}
 .abimg img{aspect-ratio:4/3}
 .abimg .tag{padding:18px 20px 0}.abimg .tag b{font-size:44px}
 .quote{font-size:19px;padding:22px 22px}
 .cred{grid-template-columns:1fr}
 .team{grid-template-columns:1fr;gap:22px;max-width:440px;margin:0 auto}
 .tl{grid-template-columns:1fr 1fr;row-gap:36px;border-top:0}
 .tli{border-top:2px solid var(--navy);padding:26px 14px 0 0}
 .tli b{font-size:40px}
 .steps-s{padding-top:80px}
 .steps{grid-template-columns:1fr}
 .st{border-right:0;border-bottom:1px solid var(--line);padding:32px 24px}
 .st h3{margin:22px 0 10px;font-size:23px}
 .ct{grid-template-columns:1fr}
 form{padding:28px 20px}
 .fg{grid-template-columns:1fr;gap:0}
 .fgd{grid-template-columns:1fr 1fr}
 .fgd>div:first-child{grid-column:1/-1}
 .fb{flex-direction:column;gap:6px}
}

<div class="rv"><div class="eb">Über uns</div><h2>Offenheit ist<br>die Grundlage.</h2>
<p>Advisor Treuhand ist in allen Bereichen des Revisions- und Treuhandwesens tätig. Unser Ziel ist es, die Bedürfnisse unserer Klienten zu erkennen und so die Basis für eine erfolgreiche Beratung zu legen.</p>
<p>Je offener Sie mit uns kommunizieren, desto höher wird die Qualität unserer Beratung sein. Auch Sie dürfen von uns Offenheit erwarten.</p>
<div class="quote">«Ein erstes informatives Gespräch ist selbstverständlich für Sie kostenlos.»<small>Peter Piller, Inhaber</small></div>

<script>
(function(){
  var html=document.getElementById('page').textContent.replace(/<\uE000/g,'<');
  var df=document.getElementById('dframe'),pf=document.getElementById('pframe');
  df.srcdoc=html;pf.srcdoc=html;
  document.getElementById('full').onclick=function(){
    var w=null;
    try{var url=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));w=window.open(url,'_blank')}catch(e){}
    if(!w){try{w=window.open('','_blank');if(w){w.document.open();w.document.write(html);w.document.close()}}catch(e){}}
    if(!w){document.body.classList.add('fs')}
  };
  var mode='both';
  document.querySelectorAll('.seg button').forEach(function(btn){btn.onclick=function(){mode=btn.dataset.m;document.querySelectorAll('.seg button').forEach(function(x){x.classList.toggle('on',x===btn)});layout()}});
  var stage=document.getElementById('stage'),desk=document.getElementById('desk'),phone=document.getElementById('phone'),ds=document.getElementById('dscreen'),ps=document.getElementById('pscreen');
  function layout(){
    var vw=document.documentElement.clientWidth,vh=window.innerHeight,hh=document.querySelector('header').offsetHeight;
    var pad=vw<700?16:36;stage.style.padding=pad+'px';
    var availH=Math.max(560,vh-hh-pad*2);
    var row=vw>=1100&&mode==='both';
    stage.style.flexDirection=row?'row':'column';stage.style.alignItems=row?'flex-start':'center';
    desk.classList.toggle('hidden',mode==='phone');phone.classList.toggle('hidden',mode==='desktop');
    desk.style.flex=row?'1 1 auto':'0 0 auto';desk.style.width=row?'auto':'100%';
    desk.style.height=(row||mode==='desktop'?availH:Math.min(availH,Math.round(vw*0.62)))+'px';
    var s=Math.max(0.6,Math.min(mode==='phone'?1:0.92,(availH-24)/844,(vw-pad*2-24)/390));
    ps.style.width=Math.round(390*s)+'px';ps.style.height=Math.round(844*s)+'px';ps.style.borderRadius=Math.round(44*s)+'px';phone.style.borderRadius=Math.round(56*s)+'px';
    pf.style.width='390px';pf.style.height='844px';pf.style.zoom=s;
    var w=ds.clientWidth,h=ds.clientHeight,sc=(w||1000)/1440;df.style.width='1440px';df.style.height=Math.round((h||700)/sc)+'px';df.style.zoom=sc;
  }
  window.addEventListener('resize',layout);layout();setTimeout(layout,300);
  [df,pf].forEach(function(f){f.addEventListener('load',function(){var l=f.parentNode.querySelector('.load');if(l)l.remove()})});
})();
</script>
