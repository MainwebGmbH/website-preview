    <div class="eyebrow">Die Gründerin</div>
    <h2>Gegründet aus <em>Leidenschaft</em> für Zahlen.</h2>
    <p class="lead" style="margin-top:22px">Am 20. März 2003 gründete Maria Lo Giudice die miracola treuhand. Begonnen hat alles mit Steuererklärungen – heute vertrauen uns zusätzlich viele KMU und Non-Profit-Organisationen.</p>
    <p style="color:var(--mut)">Von 2006 bis 2011 war Maria Lo Giudice Finanzverantwortliche bei der Synthes GmbH. Heute ist sie Präsidentin und Finanzdelegierte des Kaufmännischen Verbands Solothurn – und mit Herzblut Unternehmerin in Grenchen.</p>
    <div class="creds">
      <div>Eidg. dipl. Expertin in Rechnungslegung und Controlling</div>
      <div>Mitglied des Verbands VEB</div>
      <div>Präsidentin Kaufmännischer Verband Solothurn</div>
      <div>Ehemals Finanzverantwortliche Synthes GmbH</div>
    </div>
    <blockquote>«Carpe Diem – geniesse den Tag, an das Bürokratische denken wir!»<span>Maria Lo Giudice</span></blockquote>

<script>
(function(){
  var html=document.getElementById('page').textContent.replace(/<\uE000/g,'<');
  var url=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));
  var df=document.getElementById('dframe'),pf=document.getElementById('pframe');
  df.src=url;pf.src=url;
  document.getElementById('full').onclick=function(){window.open(url,'_blank')};
  var mode='both';
  document.querySelectorAll('.seg button').forEach(function(btn){btn.onclick=function(){mode=btn.dataset.m;document.querySelectorAll('.seg button').forEach(function(x){x.classList.toggle('on',x===btn)});layout()}});
  var stage=document.getElementById('stage'),desk=document.getElementById('desk'),phone=document.getElementById('phone'),ds=document.getElementById('dscreen'),ps=document.getElementById('pscreen');
  function layout(){
    var vw=document.documentElement.clientWidth,vh=window.innerHeight,hh=document.querySelector('header').offsetHeight;
    var pad=vw<700?16:36;stage.style.padding=pad+'px';
    var availH=Math.max(560,vh-hh-pad*2);
    var row=vw>=1100&&mode==='both';
    stage.style.flexDirection=row?'row':'column';stage.style.alignItems=row?'flex-start':'center';
    desk.classList.toggle('hidden',mode==='phone');phone.classList.toggle('hidden',mode==='desktop');
    desk.style.flex=row?'1 1 auto':'0 0 auto';desk.style.width=row?'auto':'100%';
    desk.style.height=(row||mode==='desktop'?availH:Math.min(availH,Math.round(vw*0.62)))+'px';
    var s=Math.max(0.6,Math.min(mode==='phone'?1:0.92,(availH-24)/844,(vw-pad*2-24)/390));
    ps.style.width=Math.round(390*s)+'px';ps.style.height=Math.round(844*s)+'px';ps.style.borderRadius=Math.round(44*s)+'px';phone.style.borderRadius=Math.round(56*s)+'px';
    pf.style.width='390px';pf.style.height='844px';pf.style.zoom=s;
    var w=ds.clientWidth,h=ds.clientHeight,sc=(w||1000)/1440;df.style.width='1440px';df.style.height=Math.round((h||700)/sc)+'px';df.style.zoom=sc;
  }
  window.addEventListener('resize',layout);layout();setTimeout(layout,300);
  [df,pf].forEach(function(f){f.addEventListener('load',function(){var l=f.parentNode.querySelector('.load');if(l)l.remove()})});
})();
</script>
