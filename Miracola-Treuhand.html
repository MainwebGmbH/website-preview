@media (max-width:700px){
  body{font-size:16px}
  .wrap{padding:0 20px}
  section{padding:84px 0}
  .hdr .wrap{height:70px}.logo img{height:32px}
  .mnav.open{inset:70px 0 0}
  .hcta .btn{display:none}
  .hero{flex-direction:column;align-items:stretch;min-height:0}
  .hero .hbg{position:relative;width:100%;height:300px;object-position:62% 40%}
  .hero:before{display:none}
  .hero .hin{padding-top:40px;padding-bottom:48px}
  .hbtns .btn{flex:1 1 100%;justify-content:center}
  .facts .wrap{grid-template-columns:1fr 1fr}
  .fc{padding:28px 14px}.fc:nth-child(odd){border-left:0;padding-left:0}.fc:nth-child(n+3){border-top:1px solid var(--line)}
  .fimg .a{width:88%}
  .fimg .tag{left:auto;right:0;bottom:-20px}
  .creds{grid-template-columns:1fr}
  .mos{grid-template-columns:1fr 1fr;grid-auto-rows:150px}
  .m1{grid-column:span 2;grid-row:span 2}.m2,.m3,.m4,.m5{grid-column:span 1;grid-row:span 1}
  .sgrid{grid-template-columns:1fr}
  .tgrid{gap:32px 16px}
  .tm h3{font-size:19px}.tm p{font-size:13px}.tm a{font-size:12px;word-break:break-all}
  .tm.lead-card{grid-template-columns:1fr}
  .tm.lead-card .ph{aspect-ratio:1/1}
  .tm.lead-card .tb{padding:20px 18px 24px}
  .tnote{grid-template-columns:1fr;gap:20px;padding:20px}
  .lgrid{grid-template-columns:repeat(2,1fr)}
  .region .rimg{min-height:300px}
  .region .rt{padding:60px 20px}
  .proc{grid-template-columns:1fr;gap:28px}
  .form{padding:28px 20px}
  .fg{grid-template-columns:1fr}
  .band{padding:110px 0}
  .mbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:fixed;left:12px;right:12px;bottom:12px;z-index:60;transform:translateY(130%);transition:transform .35s}
  .mbar.show{transform:none}
  .mbar a{height:52px;display:flex;align-items:center;justify-content:center;font:700 15px var(--fb);text-decoration:none;box-shadow:0 16px 30px -12px rgba(0,0,0,.45)}
  .mbar a:first-child{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .mbar a:last-child{background:var(--r);color:#fff}
  .ftr{padding-bottom:100px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.rv{opacity:1;transform:none}}

/* ===== Hero neu: gerahmtes Bild, kein Verlauf ===== */
.hero{--gut:max(32px,calc((100vw - 1240px)/2 + 32px));min-height:clamp(640px,52vw,800px);background:var(--cream);isolation:isolate}
.hero:before{z-index:0;background:radial-gradient(rgba(28,28,30,.13) 1.1px,transparent 1.2px) 0 0/22px 22px;-webkit-mask-image:linear-gradient(90deg,#000,transparent 55%);mask-image:linear-gradient(90deg,#000,transparent 55%)}
.hero:after{content:"";position:absolute;z-index:0;top:0;right:0;width:calc(var(--gut) + 150px);height:74%;background:var(--r)}
.hero .hbg{z-index:1;top:72px;bottom:72px;right:calc(var(--gut) + 40px);left:auto;width:min(44vw,600px);height:calc(100% - 144px);object-position:64% 38%;box-shadow:0 50px 90px -40px rgba(20,10,10,.55);clip-path:inset(0 0 0 0);animation:hReveal 1.3s cubic-bezier(.7,0,.2,1) both}
@keyframes hReveal{from{clip-path:inset(0 0 0 100%)}to{clip-path:inset(0 0 0 0)}}
.hero .hframe{position:absolute;z-index:0;top:44px;bottom:100px;right:calc(var(--gut) + 12px);width:min(44vw,600px);border:1.5px solid var(--ink);opacity:.18}
.hero .hcard{position:absolute;z-index:3;bottom:40px;left:calc(100% - var(--gut) - 40px - min(44vw,600px) - 48px);background:#fff;padding:20px 24px 20px 22px;max-width:300px;border-left:3px solid var(--r);box-shadow:0 30px 60px -28px rgba(0,0,0,.4);animation:hUp .9s .9s cubic-bezier(.2,.7,.2,1) both}
.hero .hcard b{display:block;font:600 21px/1.15 var(--fh);color:var(--ink)}
.hero .hcard span{display:block;margin-top:6px;font-size:13.5px;line-height:1.45;color:var(--mut)}
@keyframes hUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.hero .inner{max-width:min(560px,calc(100vw - var(--gut) - min(44vw,600px) - 140px))}
.hero h1{font-size:clamp(52px,5.9vw,92px)}
@media (prefers-reduced-motion:reduce){.hero .hbg,.hero .hcard{animation:none}}
@media (max-width:1080px){
 .hero:before{background:radial-gradient(rgba(28,28,30,.13) 1.1px,transparent 1.2px) 0 0/22px 22px}
 .hero .hbg{width:40vw;right:calc(var(--gut) + 24px)}
 .hero .hframe{width:40vw;right:var(--gut)}
 .hero .hcard{left:calc(100% - var(--gut) - 24px - 40vw - 36px);max-width:260px}
 .hero .inner{max-width:calc(100vw - var(--gut) - 40vw - 90px)}
 .hero h1{font-size:clamp(46px,6vw,64px)}
}
@media (max-width:700px){
 .hero{display:flex;flex-direction:column;padding-top:0}
 .hero:after{width:62%;height:250px;top:0}
 .hero:before{-webkit-mask-image:none;mask-image:none;opacity:.6}
 .hero .hbg{position:relative;top:auto;bottom:auto;right:auto;margin:24px 20px 0 auto;width:calc(100% - 44px);height:340px;object-position:64% 35%}
 .hero .hframe{display:none}
 .hero .hcard{position:relative;left:auto;right:auto;bottom:auto;margin:-46px auto 0 20px;max-width:280px;padding:16px 18px}
 .hero .inner{max-width:none}
 .hero .hin{padding-top:34px}
}
</style>

    <h2>Gegründet aus <em>Leidenschaft</em> für Zahlen.</h2>
    <p class="lead" style="margin-top:22px">Am 20. März 2003 gründete Maria Lo Giudice die miracola treuhand. Begonnen hat alles mit Steuererklärungen – heute vertrauen uns zusätzlich viele KMU und Non-Profit-Organisationen.</p>
    <p style="color:var(--mut)">Von 2006 bis 2011 war Maria Lo Giudice Finanzverantwortliche bei der Synthes GmbH. Heute ist sie Präsidentin und Finanzdelegierte des Kaufmännischen Verbands Solothurn – und mit Herzblut Unternehmerin in Grenchen.</p>
    <div class="creds">
      <div>Eidg. dipl. Expertin in Rechnungslegung und Controlling</div>
      <div>Mitglied des Verbands VEB</div>
      <div>Präsidentin Kaufmännischer Verband Solothurn</div>
      <div>Ehemals Finanzverantwortliche Synthes GmbH</div>
    </div>
    <blockquote>«Carpe Diem – geniesse den Tag, an das Bürokratische denken wir!»<span>Maria Lo Giudice</span></blockquote>
